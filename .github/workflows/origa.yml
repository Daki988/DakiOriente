name: Origa — build web, Android (APK / HarmonyOS 2) et iOS

on:
  push:
    paths: ['origa/**', '.github/workflows/origa.yml']
  pull_request:
    paths: ['origa/**', '.github/workflows/origa.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: origa

env:
  # Adresse publique des pages QR ouvertes par les consommateurs (application web déployée sur Vercel).
  VITE_PUBLIC_BASE: https://origa-daki11.vercel.app/

jobs:
  web:
    name: Tests et build web (PWA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: origa/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: origa-web, path: origa/dist }

  server:
    name: Tests du serveur national (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: origa, POSTGRES_PASSWORD: origa, POSTGRES_DB: origa_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U origa" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: origa/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: origa/server/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env: { TEST_DATABASE_URL: 'postgresql://origa:origa@localhost:5432/origa_test' }
      - run: npm run build
      - run: docker build -t origa-server .

  android:
    name: APK Android (compatible HarmonyOS 2)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: origa/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      # Le SDK Android est préinstallé sur les machines ubuntu de GitHub (ANDROID_HOME).
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: origa-android-apk, path: origa/android/app/build/outputs/apk/debug/app-debug.apk }
      # Version de publication signée (APK pour HarmonyOS / installation directe, AAB pour les magasins).
      # Sans les secrets ORIGA_KEYSTORE_*, une clé jetable valide la configuration sans rien publier.
      - name: Préparer la clé de signature
        env: { KS_B64: '${{ secrets.ORIGA_KEYSTORE_BASE64 }}' }
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/origa.jks"; echo "OFFICIAL=1" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -keystore "$RUNNER_TEMP/origa.jks" -alias origa -keyalg RSA -keysize 2048 -validity 1 \
              -storepass jetable-ci -keypass jetable-ci -dname "CN=Origa CI" >/dev/null; echo "OFFICIAL=0" >> "$GITHUB_ENV"
          fi
      - name: Construire la version signée
        env:
          ORIGA_KEYSTORE_PATH: ${{ runner.temp }}/origa.jks
          ORIGA_KEYSTORE_PASSWORD: ${{ secrets.ORIGA_KEYSTORE_PASSWORD || 'jetable-ci' }}
          ORIGA_KEY_ALIAS: ${{ secrets.ORIGA_KEY_ALIAS || 'origa' }}
          ORIGA_KEY_PASSWORD: ${{ secrets.ORIGA_KEY_PASSWORD || 'jetable-ci' }}
          ORIGA_VERSION_CODE: ${{ github.run_number }}
        run: cd android && ./gradlew assembleRelease bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: env.OFFICIAL == '1'
        with:
          name: origa-android-release
          path: |
            origa/android/app/build/outputs/apk/release/app-release.apk
            origa/android/app/build/outputs/bundle/release/app-release.aab

  ios:
    name: App iOS (simulateur, sans signature)
    runs-on: macos-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: origa/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - run: cd ios/App && pod install
      - run: >
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug
          -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - run: cd build/Build/Products/Debug-iphonesimulator && zip -r ../../../../origa-ios-simulator.zip App.app
      - uses: actions/upload-artifact@v4
        with: { name: origa-ios-simulator, path: origa/origa-ios-simulator.zip }

  release:
    name: Publication des fichiers à télécharger
    needs: [android, ios]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions: { contents: write }
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out }
      - name: Publier la release « origa-latest »
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cd out
          cp origa-android-apk/app-debug.apk Origa-Android-HarmonyOS.apk
          cp origa-ios-simulator/origa-ios-simulator.zip Origa-iOS-simulateur.zip
          (cd origa-web && zip -qr ../Origa-web.zip .)
          gh release delete origa-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create origa-latest --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Origa — dernière version (build ${{ github.run_number }})" \
            --notes "Version de démonstration. APK pour Android et HarmonyOS 2 (installation directe), app iOS pour le simulateur Xcode, version web. Page d'installation : https://origa-ten.vercel.app/#/telecharger" \
            Origa-Android-HarmonyOS.apk Origa-iOS-simulateur.zip Origa-web.zip
