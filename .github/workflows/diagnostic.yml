# Diagnostic de la mise en ligne (lecture seule) : compare les pages présentes sur l'hébergement avec l'état
# enregistré par la dernière synchronisation FTP. Lancement manuel (Actions → Diagnostic → Run workflow).
name: Diagnostic

on:
  workflow_dispatch:
  push:
    branches: ["claude/navigoal-specs-tqkh43"]
    paths: [".github/workflows/diagnostic.yml"]

jobs:
  ftp:
    runs-on: ubuntu-latest
    environment: production
    env:
      S: ${{ secrets.NAVIGOAL_FTP_SERVER || secrets.FTP_SERVER }}
      U: ${{ secrets.NAVIGOAL_FTP_USERNAME || secrets.FTP_USERNAME }}
      P: ${{ secrets.NAVIGOAL_FTP_PASSWORD || secrets.FTP_PASSWORD }}
      D: ${{ vars.NAVIGOAL_FTP_DIR || '/navigoal/' }}
      DAILY: ${{ secrets.DAILY_API_KEY }}
      DAILY_VAR: ${{ vars.DAILY_API_KEY }}
    steps:
      # Clés déposées par la mise en ligne : seuls les noms et les longueurs sont affichés, jamais les valeurs.
      - name: Clés (secrets GitHub et .env.github)
        run: |
          echo "Secret GitHub DAILY_API_KEY : $([ -n "$DAILY" ] && echo "présent (${#DAILY} caractères)" || echo absent)"
          [ -n "$DAILY_VAR" ] && echo "Attention : DAILY_API_KEY existe aussi comme VARIABLE (non secrète) : à supprimer, la clé doit être un secret."
          curl -s --user "$U:$P" "ftp://$S${D%/}/.env.github" > env.github || true
          echo "Fichier .env.github sur le serveur : $(wc -c < env.github) octets"
          sed -E 's/^([A-Za-z_]+)=(.*)$/\1 = (\2)/' env.github | awk '{ v=$3; gsub(/[()]/,"",v); print "  " $1 " : " length(v) " caractères" }'
          rm -f env.github
          if [ -n "$DAILY" ]; then
            echo "Clé acceptée par Daily : $(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $DAILY" 'https://api.daily.co/v1/rooms?limit=1') (200 = oui)"
            # Essai complet, comme l'application : salle privée de 10 min, jeton d'accès, puis suppression de la salle.
            exp=$(( $(date +%s) + 600 ))
            salle=$(curl -s -X POST -H "Authorization: Bearer $DAILY" -H 'Content-Type: application/json' -d "{\"name\":\"diagnostic-$(date +%s)\",\"privacy\":\"private\",\"properties\":{\"exp\":$exp,\"eject_at_room_exp\":true,\"enable_prejoin_ui\":true,\"lang\":\"fr\"}}" https://api.daily.co/v1/rooms)
            nom=$(echo "$salle" | jq -r '.name // empty'); echo "Salle d'essai : ${nom:-ÉCHEC} · adresse : $(echo "$salle" | jq -r '.url // empty') $(echo "$salle" | jq -c 'select(.error) | {error, info}')"
            if [ -n "$nom" ]; then
              jeton=$(curl -s -X POST -H "Authorization: Bearer $DAILY" -H 'Content-Type: application/json' -d "{\"properties\":{\"room_name\":\"$nom\",\"user_name\":\"Diagnostic\",\"exp\":$exp,\"eject_at_token_exp\":true,\"lang\":\"fr\"}}" https://api.daily.co/v1/meeting-tokens)
              echo "Jeton d'accès : $(echo "$jeton" | jq -r 'if .token then "obtenu (\(.token|length) caractères)" else "ÉCHEC \(.error) \(.info)" end')"
              echo "Salle visible dans le compte : $(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $DAILY" "https://api.daily.co/v1/rooms/$nom")"
              echo "Page de la salle : $(curl -s -o /dev/null -w '%{http_code}' "$(echo "$salle" | jq -r .url)")"
              curl -s -X DELETE -H "Authorization: Bearer $DAILY" "https://api.daily.co/v1/rooms/$nom" -o /dev/null
            fi
            echo "Salles d'appel créées par le site (5 dernières) :"
            curl -s -H "Authorization: Bearer $DAILY" 'https://api.daily.co/v1/rooms?limit=5' | jq -r '.data[] | "  \(.name) · créée \(.created_at) · expire \(.config.exp // "?")"'
          fi
      # Réglages du serveur : on n'affiche QUE les noms des variables et la longueur de leur valeur,
      # jamais les valeurs elles-mêmes. Sert à savoir si l'envoi d'e-mails est configuré.
      - name: Réglages du serveur (.env) — noms seulement
        run: |
          curl -s --user "$U:$P" "ftp://$S${D%/}/.env" > env.srv || true
          echo "Fichier .env sur le serveur : $(wc -c < env.srv) octets"
          grep -E '^[A-Za-z_][A-Za-z0-9_]*=' env.srv | while IFS='=' read -r nom reste; do
            echo "  $nom : ${#reste} caractères"
          done
          echo
          for v in SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS MAIL_FROM; do
            grep -qE "^$v=.+" env.srv && echo "$v : présent" || echo "$v : ABSENT"
          done
          if grep -qE '^SMTP_HOST=.+' env.srv; then
            h=$(grep -E '^SMTP_HOST=' env.srv | head -1 | cut -d= -f2- | tr -d '"'"'"'\r')
            pt=$(grep -E '^SMTP_PORT=' env.srv | head -1 | cut -d= -f2- | tr -d '"'"'"'\r'); pt=${pt:-465}
            echo "Port $pt joignable sur $h : $(timeout 10 bash -c "cat < /dev/null > /dev/tcp/$h/$pt" 2>/dev/null && echo oui || echo non)"
          else
            echo "=> Aucun SMTP configure : l'application journalise les e-mails au lieu de les envoyer."
          fi
          rm -f env.srv

      - name: Pages et état de synchronisation
        run: |
          base="ftp://$S${D%/}"
          get() { curl -s --user "$U:$P" "$base/$1"; }
          get .ftp-deploy-sync-state.json > etat.json || true
          echo "Etat : $(wc -c < etat.json) octets, généré le $(jq -r '.generatedTime // empty' etat.json)"
          for f in index metiers etablissements connexion; do
            p="serveur/.next/server/app/$f.html"
            get "$p" > page.html || true
            echo "== $p : $(wc -c < page.html) octets, layout $(grep -o 'app/layout-[0-9a-f]*' page.html | head -1)"
            echo "   date sur le serveur : $(curl -s --user "$U:$P" -Q "MDTM ${D%/}/$p" "$base/" -I 2>&1 | grep -i '^213' || curl -s --user "$U:$P" -I "$base/$p" | grep -i last-modified)"
            echo "   hachage local du fichier : $(sha256sum page.html | cut -c1-16)"
            echo "   état FTP : $(jq -c --arg n "./$p" '.data[] | select(.name==$n) | {size, hash: (.hash|.[0:16])}' etat.json 2>/dev/null)"
          done
          echo "== Dossier tmp et fichiers de version"
          get version.txt; get .version-appliquee
          curl -s --user "$U:$P" --list-only "$base/serveur/.next/" | head -20
          echo "== demarrages.log"
          get demarrages.log | tail -40
          echo "== Fichier témoin : envoyé dans serveur/public puis demandé au site"
          t="diag-$(date +%s).txt"; echo "temoin $t" > "$t"
          curl -s --user "$U:$P" -T "$t" "$base/serveur/public/$t" && sleep 3
          echo "réponse du site : $(curl -s -A 'Mozilla/5.0 (iPhone) Safari' -m 20 "https://navigoal.net/$t" | head -c 80)"
          curl -s --user "$U:$P" -Q "DELE ${D%/}/serveur/public/$t" "$base/" -o /dev/null || true
          echo "== serveur/.next/cache (contenu)"
          for d in "" fetch-cache images app server; do echo "-- cache/$d"; curl -s --user "$U:$P" "$base/serveur/.next/cache/$d/" | head -15; done
          echo "== Racine"
          curl -s --user "$U:$P" "$base/" | head -40
          echo "== tmp"
          curl -s --user "$U:$P" "$base/tmp/" | head
          for f in stderr.log stdout.log logs/stderr.log; do
            echo "== $f (dernières lignes, sans adresses ni jetons)"
            get "$f" | tail -60 | sed -E 's/[0-9]{1,3}(\.[0-9]{1,3}){3}/<ip>/g; s/(token|password|secret|key)=[^ &]*/\1=<masqué>/Ig' || true
          done
