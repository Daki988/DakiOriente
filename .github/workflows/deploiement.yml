# Mise en ligne automatique de Navigoal sur LWS (FTP), sur le même principe que le site NEAM :
# à chaque envoi sur la branche de production, ou à la main (onglet Actions → Run workflow).
# Contrôles (lint, typage, tests), construction du paquet, envoi par FTP des seuls fichiers modifiés, puis redémarrage.
# Au démarrage, app.js sauvegarde la base, applique les migrations et les référentiels, et vide le cache.
# Ne touche jamais : .env, stockage/ (pièces déposées), sauvegardes/, acces/.
#
# À régler une fois : GitHub → Settings → Secrets and variables → Actions
#   Secrets   : NAVIGOAL_FTP_SERVER (ex. ftp.navigoal.net), NAVIGOAL_FTP_USERNAME, NAVIGOAL_FTP_PASSWORD
#               (à défaut, FTP_SERVER, FTP_USERNAME, FTP_PASSWORD sont utilisés)
#   Variables : NAVIGOAL_FTP_DIR (dossier de l'application vu par le compte FTP, /navigoal/ par défaut),
#               FTP_PROTOCOL (ftp ou ftps, ftp par défaut), SITE_URL (https://navigoal.net par défaut)
name: Mise en ligne

on:
  push:
    branches: ["claude/navigoal-specs-tqkh43"]
    paths: ["web/**", "data/**", "scripts/**", ".github/workflows/deploiement.yml"]
  workflow_dispatch:
  # Appelé par le robot des accréditations après une mise à jour des données (un envoi fait par un robot
  # GitHub ne déclenche pas les autres workflows) : ref = commit à mettre en ligne.
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

concurrency:
  group: mise-en-ligne
  cancel-in-progress: false

jobs:
  # Sans identifiants FTP, la mise en ligne est simplement ignorée (déploiement manuel) au lieu d'échouer.
  reglages:
    runs-on: ubuntu-latest
    environment: production   # pour voir aussi les secrets enregistrés dans l'environnement « production »
    outputs:
      ftp: ${{ steps.ftp.outputs.present }}
    steps:
      - id: ftp
        env:
          SERVEUR: ${{ secrets.NAVIGOAL_FTP_SERVER || secrets.FTP_SERVER }}
          UTILISATEUR: ${{ secrets.NAVIGOAL_FTP_USERNAME || secrets.FTP_USERNAME }}
          MOT_DE_PASSE: ${{ secrets.NAVIGOAL_FTP_PASSWORD || secrets.FTP_PASSWORD }}
          VAR_DOSSIER: ${{ vars.NAVIGOAL_FTP_DIR }}
          VAR_SERVEUR: ${{ vars.NAVIGOAL_FTP_SERVER }}
          VAR_UTILISATEUR: ${{ vars.NAVIGOAL_FTP_USERNAME }}
          VAR_MOT_DE_PASSE: ${{ vars.NAVIGOAL_FTP_PASSWORD }}
        run: |
          for v in VAR_DOSSIER VAR_SERVEUR VAR_UTILISATEUR VAR_MOT_DE_PASSE; do echo "Variable ${v#VAR_} : $([ -n "${!v}" ] && echo présente || echo absente)"; done
          [ -n "$VAR_MOT_DE_PASSE" ] && echo "::warning::Le mot de passe FTP est enregistré comme Variable (visible) : déplacez-le dans l'onglet Secrets."
          echo "Serveur : $([ -n "$SERVEUR" ] && echo présent || echo absent) ; identifiant : $([ -n "$UTILISATEUR" ] && echo présent || echo absent) ; mot de passe : $([ -n "$MOT_DE_PASSE" ] && echo présent || echo absent)"
          if [ -n "$SERVEUR" ]; then echo "present=oui" >> "$GITHUB_OUTPUT"
          else echo "::notice::Identifiants FTP non réglés : mise en ligne automatique ignorée (voir LISEZMOI-DEPLOIEMENT.md § 6)."; fi

  mise-en-ligne:
    needs: reglages
    if: needs.reglages.outputs.ftp == 'oui'
    runs-on: ubuntu-latest
    timeout-minutes: 150  # premier envoi FTP : tout le paquet, fichier par fichier
    environment: production
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      SITE: ${{ vars.SITE_URL || 'https://navigoal.net' }}
      FTP_SERVER: ${{ secrets.NAVIGOAL_FTP_SERVER || secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.NAVIGOAL_FTP_USERNAME || secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.NAVIGOAL_FTP_PASSWORD || secrets.FTP_PASSWORD }}
      FTP_DIR: ${{ vars.NAVIGOAL_FTP_DIR || '/navigoal/' }}
      FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL || 'ftp' }}
    steps:
      - name: Vérifier les réglages
        working-directory: .
        run: |
          for v in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::$v n'est pas réglé (Settings → Secrets and variables → Actions, voir LISEZMOI-DEPLOIEMENT.md § 6)"; exit 1; }
          done
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Aucun secret dans le dépôt
        working-directory: .
        run: node scripts/verifier-secrets.mjs
      - run: npm ci
      - run: npm run sync
      - name: Lint
        run: npm run lint
      - name: Typage
        run: npx tsc --noEmit
      - name: Tests
        env:
          TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres
        run: npm test
      - name: Paquet de déploiement
        env:
          NEXT_PUBLIC_SITE_URL: ${{ env.SITE }}
          VERSION_PAQUET: ${{ inputs.ref || github.sha }}   # nouvelle version → migrations et référentiels rechargés
        run: node scripts/package-cpanel.mjs

      - name: Envoyer sur LWS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          protocol: ${{ env.FTP_PROTOCOL }}
          local-dir: ./livraison/navigoal/
          server-dir: ${{ env.FTP_DIR }}
          exclude: |
            .env
            .env.github
            stockage/**
            sauvegardes/**
            acces/**
            tmp/**

      # Clés gérées dans les secrets GitHub (Settings › Secrets and variables › Actions), déposées dans .env.github
      # sans toucher au .env du serveur (qui reste prioritaire). Fichier jamais affiché dans le journal.
      - name: Clés depuis les secrets GitHub
        working-directory: .
        env:
          DAILY_API_KEY: ${{ secrets.DAILY_API_KEY }}
        run: |
          umask 077
          : > .env.github
          [ -n "$DAILY_API_KEY" ] && printf 'DAILY_API_KEY=%s\n' "$DAILY_API_KEY" >> .env.github
          if [ -s .env.github ]; then
            [ "$FTP_PROTOCOL" = ftps ] && tls="--ssl-reqd" || tls=""
            curl -sS $tls --ftp-create-dirs -T .env.github --user "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER${FTP_DIR%/}/.env.github"
            # Lisible du seul compte, comme .env (la commande CHMOD n'est pas acceptée par tous les serveurs FTP).
            curl -sS $tls --user "$FTP_USERNAME:$FTP_PASSWORD" -Q "SITE CHMOD 600 ${FTP_DIR%/}/.env.github" "ftp://$FTP_SERVER${FTP_DIR%/}/" -o /dev/null || echo "Droits de .env.github non modifiés (CHMOD refusé)"
            echo "Clés déposées : $(cut -d= -f1 .env.github | tr '\n' ' ')"
          else
            echo "Aucune clé dans les secrets GitHub (DAILY_API_KEY) : rien à déposer."
          fi
          rm -f .env.github

      # Envoyé en dernier, une fois tous les fichiers en place : Passenger relance l'application à la requête suivante.
      - name: Redémarrer l'application
        working-directory: .
        run: |
          echo "${{ inputs.ref || github.sha }}" > restart.txt
          [ "$FTP_PROTOCOL" = ftps ] && tls="--ssl-reqd" || tls=""
          curl -sS $tls --ftp-create-dirs -T restart.txt --user "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER${FTP_DIR%/}/tmp/restart.txt"

      - name: Le site répond
        run: |
          sleep 10
          curl -s -m 120 -o /dev/null "$SITE/" || true   # premier appel : démarrage, sauvegarde et migrations
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -m 30 -w '%{http_code}' "$SITE/api/sante/" || true)
            [ "$code" = 200 ] && { echo "Site en ligne."; exit 0; }
            echo "Essai $i : réponse $code"; sleep 10
          done
          echo "::error::Le site ne répond pas après la mise en ligne ($SITE/api/sante/). Consultez navigoal/stderr.log sur l'hébergement."
          exit 1
