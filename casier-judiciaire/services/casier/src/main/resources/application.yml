# Service Casier — configuration commune. Aucun secret ici (SEC-05) : tout secret vient de l'environnement.
spring:
  application:
    name: service-casier
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${CASIER_BD_URL:jdbc:postgresql://localhost:5432/casier}
    username: ${CASIER_BD_UTILISATEUR:casier}
    password: ${CASIER_BD_MOT_DE_PASSE:}
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true
      republish-outstanding-events-on-restart: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Clés publiques du fournisseur d'identité (Keycloak) ; chargées à la première requête authentifiée.
          jwk-set-uri: ${CASIER_OIDC_JWKS:http://localhost:8180/realms/casier/protocol/openid-connect/certs}

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs

casier:
  demandes:
    delai-traitement: 24h
    seuil-alerte: 4h
    adresse-portail: ${CASIER_ADRESSE_PORTAIL:https://casier-judiciaire.neamindustry.com}
  identification:
    certitude: 0.90
    doute: 0.55
    nom-seul: 0.85
    ecart-minimal: 0.08
  public:
    limite-par-minute: ${CASIER_LIMITE_PAR_MINUTE:30}
  paiement:
    secret-notifications: ${CASIER_PAIEMENT_SECRET:}
    simulateur: false
  bulletins:
    adresse-verification: ${CASIER_ADRESSE_VERIFICATION:https://casier-judiciaire.neamindustry.com}
    # BUL-05 : filigrane « Spécimen » tant que la plateforme n'est pas officiellement en service.
    specimen: true
    sceau:
      magasin: ${CASIER_SCEAU_MAGASIN:}
      mot-de-passe: ${CASIER_SCEAU_MOT_DE_PASSE:}
      alias: ${CASIER_SCEAU_ALIAS:}
      exiger-certificat: false
  referentiels:
    import-au-demarrage: false
    dossier: ${CASIER_REFERENTIELS:../../referentiels}
    tarifs: tarifs-proposition-2024-06-25.json
    regles: regles-bulletins-fictives.json

---
# Poste de développement et démonstration : référentiels chargés au démarrage, simulateur de paiement (ENV-03, PAY-07).
spring:
  config:
    activate:
      on-profile: local,demo
casier:
  referentiels:
    import-au-demarrage: true
  paiement:
    simulateur: true

---
# Production (datacenter national) : certificat qualifié obligatoire, pas de spécimen, pas de simulateur (BUL-01, ENV-03).
spring:
  config:
    activate:
      on-profile: prod
casier:
  bulletins:
    specimen: false
    sceau:
      exiger-certificat: true
  paiement:
    simulateur: false
  referentiels:
    import-au-demarrage: false
