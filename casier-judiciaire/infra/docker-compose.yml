# Environnement local de développement : PostgreSQL 16 et Keycloak (fournisseur d'identité, section 18).
# Données fictives uniquement (DON-06). Aucun mot de passe ici (SEC-05) : copiez .env.exemple en .env et renseignez-le.
#   docker compose -f infra/docker-compose.yml --env-file infra/.env up -d
name: casier-judiciaire

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: casier
      POSTGRES_USER: casier
      POSTGRES_PASSWORD: ${CASIER_BD_MOT_DE_PASSE:?Renseignez CASIER_BD_MOT_DE_PASSE dans infra/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - donnees-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casier -d casier"]
      interval: 5s
      retries: 10

  keycloak:
    image: keycloak/keycloak:26.0.7
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_MOT_DE_PASSE:?Renseignez KEYCLOAK_ADMIN_MOT_DE_PASSE dans infra/.env}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ./keycloak/casier-realm.json:/opt/keycloak/data/import/casier-realm.json:ro

volumes:
  donnees-postgres:
