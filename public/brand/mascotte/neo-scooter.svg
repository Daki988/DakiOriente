<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" role="img" aria-labelledby="t">
  <title id="t">Néo en scooter de livraison NEAM</title>
  <defs>
    <linearGradient id="body" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#7cf7bd"/>
      <stop offset="0.45" stop-color="#22d884"/>
      <stop offset="1" stop-color="#079b5a"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#14c977"/>
      <stop offset="1" stop-color="#9dfccf"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.35" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d7a4f"/>
      <stop offset="1" stop-color="#04241b"/>
    </linearGradient>
  </defs>
  <ellipse cx="290" cy="462" rx="210" ry="13" fill="#04241b" opacity="0.18"/>
  <!-- traits de vitesse -->
  <g id="speed" stroke="#ffffff" stroke-linecap="round" opacity="0.85">
    <path d="M14 250 h70" stroke-width="9"/><path d="M0 300 h96" stroke-width="7"/><path d="M30 350 h56" stroke-width="6"/>
  </g>
  <!-- caisse de livraison sur le porte-bagages -->
  <g id="box">
    <rect x="44" y="196" width="128" height="118" rx="20" fill="#04241b"/>
    <rect x="44" y="196" width="128" height="28" rx="14" fill="#0a5a39"/>
    <g transform="translate(79 240) scale(0.48)" fill="#ffffff"><path d="M44 6 L62 6 L94 84 L74 84 Z" opacity="0.8"/><path d="M4 86 C12 56 24 28 44 6 L62 6 C44 28 34 56 28 86 Z"/><path d="M74 84 L94 84 C100 56 106 28 118 3 C98 14 84 44 74 84 Z"/></g>
    <rect x="70" y="312" width="90" height="10" rx="5" fill="#0b1a14"/>
  </g>
  <!-- Néo assis, penché vers l'avant -->
  <g id="rider" transform="translate(66 46) rotate(6 200 300) scale(0.7)">
  <!-- corps -->
  <path id="bodyShape" d="M200 118 C 292 118, 332 196, 326 284 C 320 372, 262 404, 200 404 C 138 404, 80 372, 74 284 C 68 196, 108 118, 200 118 Z" fill="url(#body)"/>
  <ellipse cx="160" cy="210" rx="70" ry="60" fill="url(#shine)"/>

  <!-- feuille du N qui sort de la casquette -->
  <path id="sprout" d="M226 150 C 240 104, 280 72, 338 62 C 326 112, 290 150, 244 162 Z" fill="url(#leaf)"/>
  <path d="M236 152 C 262 120, 290 96, 324 76" stroke="#0b9a5c" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.55"/>

  <!-- casquette NEAM -->
  <path d="M112 196 C 108 132, 168 108, 214 114 C 262 120, 296 150, 294 196 Z" fill="url(#cap)"/>
  <path d="M106 196 Q 200 214 300 190 Q 336 190 346 204 Q 226 236 104 214 Z" fill="#04241b"/>
  <g transform="translate(176 140) scale(0.42)" fill="#4fe8a1">
    <path d="M44 6 L62 6 L94 84 L74 84 Z" opacity="0.8"/>
    <path d="M4 86 C12 56 24 28 44 6 L62 6 C44 28 34 56 28 86 Z"/>
    <path d="M74 84 L94 84 C100 56 106 28 118 3 C98 14 84 44 74 84 Z"/>
  </g>

  <!-- visage -->
  <g id="face">
    <g id="eyes">
      <ellipse cx="164" cy="262" rx="27" ry="31" fill="#ffffff"/>
      <ellipse cx="238" cy="262" rx="27" ry="31" fill="#ffffff"/>
      <circle cx="170" cy="268" r="14" fill="#0b1a14"/>
      <circle cx="244" cy="268" r="14" fill="#0b1a14"/>
      <circle cx="175" cy="262" r="5" fill="#ffffff"/>
      <circle cx="249" cy="262" r="5" fill="#ffffff"/>
    </g>
    <ellipse cx="132" cy="312" rx="17" ry="10" fill="#ffa3bb" opacity="0.85"/>
    <ellipse cx="270" cy="312" rx="17" ry="10" fill="#ffa3bb" opacity="0.85"/>
    <path d="M176 314 Q 202 344 228 314 Q 202 326 176 314 Z" fill="#0b1a14"/>
    <path d="M190 326 Q 202 336 214 326 Q 202 322 190 326 Z" fill="#ff7d9a"/>
  </g>

  </g>
  <!-- scooter (vue de profil, vers la droite) -->
  <g id="scooter">
    <!-- capot arrière + selle -->
    <path d="M78 392 C 70 350, 96 318, 150 316 L 270 318 C 292 320, 300 340, 296 360 L 288 398 Z" fill="#ffffff"/>
    <path d="M120 318 C 130 300, 250 300, 268 318 Z" fill="#0b1a14"/>
    <path d="M90 360 C 120 352, 200 352, 288 362" stroke="#10c070" stroke-width="10" stroke-linecap="round" fill="none"/>
    <!-- plancher -->
    <path d="M270 384 L 372 384 C 380 384, 384 392, 380 400 L 268 404 Z" fill="#079b5a"/>
    <!-- tablier avant -->
    <path d="M352 392 C 356 330, 372 288, 396 250 L 424 258 C 404 300, 394 344, 392 396 Z" fill="#10c070"/>
    <path d="M378 286 C 384 272, 390 262, 398 254" stroke="#7cf7bd" stroke-width="5" stroke-linecap="round" fill="none"/>
    <g transform="translate(364 318) scale(0.26) rotate(-12)" fill="#ffffff"><path d="M44 6 L62 6 L94 84 L74 84 Z" opacity="0.8"/><path d="M4 86 C12 56 24 28 44 6 L62 6 C44 28 34 56 28 86 Z"/><path d="M74 84 L94 84 C100 56 106 28 118 3 C98 14 84 44 74 84 Z"/></g>
    <!-- garde-boue avant -->
    <path d="M386 392 C 396 372, 450 368, 466 396 Z" fill="#ffffff"/>
    <!-- colonne, guidon, phare -->
    <path d="M410 256 L 422 214" stroke="#0b1a14" stroke-width="12" stroke-linecap="round"/>
    <path d="M396 210 h46" stroke="#0b1a14" stroke-width="11" stroke-linecap="round"/>
    <ellipse cx="438" cy="240" rx="14" ry="11" fill="#fcd116" stroke="#0b1a14" stroke-width="4"/>
    <path d="M454 236 l46 -14 M456 246 l48 2" stroke="#fcd116" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
    <!-- roues -->
    <g id="wheelR"><circle cx="150" cy="418" r="34" fill="#0b1a14"/><circle cx="150" cy="418" r="14" fill="#d9e2dd"/><circle cx="150" cy="418" r="5" fill="#0b1a14"/></g>
    <g id="wheelF"><circle cx="428" cy="418" r="34" fill="#0b1a14"/><circle cx="428" cy="418" r="14" fill="#d9e2dd"/><circle cx="428" cy="418" r="5" fill="#0b1a14"/></g>
  </g>
  <!-- jambe vers le plancher -->
  <path d="M262 352 C 292 360, 316 372, 326 384" stroke="#0a5a39" stroke-width="22" stroke-linecap="round" fill="none"/>
  <path d="M312 376 q8 -14 30 -10 q14 4 12 18 h-40 z" fill="#ffffff"/>
  <!-- bras vers le guidon -->
  <path d="M276 270 C 320 262, 360 236, 398 214" stroke="#10c070" stroke-width="22" stroke-linecap="round" fill="none"/>
  <circle cx="404" cy="210" r="14" fill="#22d884"/>
</svg>
