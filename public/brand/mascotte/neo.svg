<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" role="img" aria-labelledby="t">
  <title id="t">Néo, la mascotte NEAM</title>
  <defs>
    <linearGradient id="body" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#7cf7bd"/>
      <stop offset="0.45" stop-color="#22d884"/>
      <stop offset="1" stop-color="#079b5a"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#14c977"/>
      <stop offset="1" stop-color="#9dfccf"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.35" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d7a4f"/>
      <stop offset="1" stop-color="#04241b"/>
    </linearGradient>
  </defs>

  <!-- ombre -->
  <ellipse cx="200" cy="458" rx="96" ry="14" fill="#04241b" opacity="0.18"/>

  <!-- sac de livraison (dans le dos) -->
  <g id="bag">
    <rect x="268" y="232" width="92" height="112" rx="18" fill="#04241b"/>
    <rect x="268" y="232" width="92" height="26" rx="13" fill="#0a5a39"/>
    <path d="M296 300 l10 -30 h9 l-10 30 z M309 270 h9 l14 28 h-9 z M323 298 l10 -30 c4 0 8 0 10 0 l-13 30 z" fill="#ffffff"/>
  </g>

  <!-- jambes et baskets (bandes vert-jaune-bleu du Gabon) -->
  <g id="legs">
    <rect x="160" y="370" width="30" height="62" rx="15" fill="#0a5a39"/>
    <rect x="212" y="370" width="30" height="62" rx="15" fill="#0a5a39"/>
    <g id="shoeL">
      <path d="M140 430 q0 -18 26 -18 h20 q16 0 16 18 v6 h-62 z" fill="#ffffff"/>
      <rect x="140" y="436" width="62" height="7" rx="3.5" fill="#079b5a"/>
      <rect x="152" y="420" width="10" height="4" rx="2" fill="#009e60"/><rect x="164" y="420" width="10" height="4" rx="2" fill="#fcd116"/><rect x="176" y="420" width="10" height="4" rx="2" fill="#3a75c4"/>
    </g>
    <g id="shoeR">
      <path d="M200 430 q0 -18 26 -18 h20 q16 0 16 18 v6 h-62 z" fill="#ffffff"/>
      <rect x="200" y="436" width="62" height="7" rx="3.5" fill="#079b5a"/>
      <rect x="212" y="420" width="10" height="4" rx="2" fill="#009e60"/><rect x="224" y="420" width="10" height="4" rx="2" fill="#fcd116"/><rect x="236" y="420" width="10" height="4" rx="2" fill="#3a75c4"/>
    </g>
  </g>

  <!-- bras gauche (salut) -->
  <g id="armL" transform="rotate(0 92 300)">
    <path d="M96 300 C 70 280, 52 250, 48 214" stroke="#10c070" stroke-width="26" stroke-linecap="round" fill="none"/>
    <ellipse cx="46" cy="200" rx="21" ry="25" fill="#22d884" transform="rotate(-12 46 200)"/>
    <ellipse cx="66" cy="208" rx="8" ry="12" fill="#22d884" transform="rotate(30 66 208)"/>
    <path d="M36 186 q10 -6 20 0" stroke="#7cf7bd" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7"/>
  </g>

  <!-- corps -->
  <path id="bodyShape" d="M200 118 C 292 118, 332 196, 326 284 C 320 372, 262 404, 200 404 C 138 404, 80 372, 74 284 C 68 196, 108 118, 200 118 Z" fill="url(#body)"/>
  <ellipse cx="160" cy="210" rx="70" ry="60" fill="url(#shine)"/>

  <!-- feuille du N qui sort de la casquette -->
  <path id="sprout" d="M226 150 C 240 104, 280 72, 338 62 C 326 112, 290 150, 244 162 Z" fill="url(#leaf)"/>
  <path d="M236 152 C 262 120, 290 96, 324 76" stroke="#0b9a5c" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.55"/>

  <!-- casquette NEAM -->
  <path d="M112 196 C 108 132, 168 108, 214 114 C 262 120, 296 150, 294 196 Z" fill="url(#cap)"/>
  <path d="M106 196 Q 200 214 300 190 Q 336 190 346 204 Q 226 236 104 214 Z" fill="#04241b"/>
  <g transform="translate(176 140) scale(0.42)" fill="#4fe8a1">
    <path d="M44 6 L62 6 L94 84 L74 84 Z" opacity="0.8"/>
    <path d="M4 86 C12 56 24 28 44 6 L62 6 C44 28 34 56 28 86 Z"/>
    <path d="M74 84 L94 84 C100 56 106 28 118 3 C98 14 84 44 74 84 Z"/>
  </g>

  <!-- visage -->
  <g id="face">
    <g id="eyes">
      <ellipse cx="164" cy="262" rx="27" ry="31" fill="#ffffff"/>
      <ellipse cx="238" cy="262" rx="27" ry="31" fill="#ffffff"/>
      <circle cx="170" cy="268" r="14" fill="#0b1a14"/>
      <circle cx="244" cy="268" r="14" fill="#0b1a14"/>
      <circle cx="175" cy="262" r="5" fill="#ffffff"/>
      <circle cx="249" cy="262" r="5" fill="#ffffff"/>
    </g>
    <ellipse cx="132" cy="312" rx="17" ry="10" fill="#ffa3bb" opacity="0.85"/>
    <ellipse cx="270" cy="312" rx="17" ry="10" fill="#ffa3bb" opacity="0.85"/>
    <path d="M176 314 Q 202 344 228 314 Q 202 326 176 314 Z" fill="#0b1a14"/>
    <path d="M190 326 Q 202 336 214 326 Q 202 322 190 326 Z" fill="#ff7d9a"/>
  </g>

  <!-- bras droit avec téléphone NEAM -->
  <g id="armR">
    <path d="M308 304 C 330 322, 336 344, 326 364" stroke="#10c070" stroke-width="26" stroke-linecap="round" fill="none"/>
    <rect x="300" y="336" width="40" height="66" rx="9" fill="#0b1a14" transform="rotate(-14 320 369)"/>
    <rect x="305" y="342" width="30" height="52" rx="6" fill="#0d7a4f" transform="rotate(-14 320 369)"/>
    <g transform="rotate(-14 320 369) translate(310 356) scale(0.17)" fill="#7cf7bd">
      <path d="M44 6 L62 6 L94 84 L74 84 Z" opacity="0.8"/>
      <path d="M4 86 C12 56 24 28 44 6 L62 6 C44 28 34 56 28 86 Z"/>
      <path d="M74 84 L94 84 C100 56 106 28 118 3 C98 14 84 44 74 84 Z"/>
    </g>
    <circle cx="326" cy="372" r="15" fill="#22d884"/>
  </g>
</svg>
