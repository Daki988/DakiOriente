<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>NEAM — Carte pliée « smartphone »</title>
<link rel="stylesheet" href="../catalogue/fonts/fonts.css">
<style>
/* Carte pliée en forme de smartphone : 70 × 140 mm fermée, 140 × 140 mm ouverte.
   Page 1 = extérieur (dos du téléphone | écran verrouillé), page 2 = intérieur (pub).
   Impression recto verso, retournement sur le bord long. 2 cartes par A4 portrait. */
@page { size: 210mm 297mm; margin: 0; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
body { font-family: "Instrument Sans", Arial, sans-serif; background: #fff; }
.page { width: 210mm; height: 297mm; position: relative; break-after: page; }
.page:last-of-type { break-after: auto; }
.note { position: absolute; left: 0; right: 0; bottom: 1.6mm; text-align: center; font: 500 6pt "IBM Plex Mono", monospace; letter-spacing: .06em; color: #8a8a8e; }
.carte { position: absolute; left: 35mm; width: 140mm; height: 140mm; }
.carte.c1 { top: 4mm; } .carte.c2 { top: 149mm; }
.forme { position: absolute; inset: 0; border-radius: 11mm; overflow: hidden; display: grid; grid-template-columns: 70mm 70mm; }
.decoupe { position: absolute; inset: 0; border-radius: 11mm; border: .2mm dashed #9a9aa0; pointer-events: none; }
.pli { position: absolute; left: 70mm; top: -4mm; bottom: -4mm; border-left: .2mm dashed #c9c9cc; }
.pli::before, .pli::after { content: "pli"; position: absolute; left: -2.5mm; font: 500 5pt "IBM Plex Mono", monospace; color: #9a9aa0; }
.pli::before { top: -3mm; } .pli::after { bottom: -3mm; }
.panneau { position: relative; overflow: hidden; }

/* ---------- Extérieur : dos du téléphone ---------- */
.dos { background: radial-gradient(120% 80% at 30% 20%, #3a3c41 0%, #1d1e21 55%, #121214 100%); }
.dos::after { content: ""; position: absolute; inset: 0; background: linear-gradient(120deg, rgba(255,255,255,.10), rgba(255,255,255,0) 35%, rgba(255,255,255,0) 75%, rgba(255,255,255,.05)); }
.photo { position: absolute; left: 6mm; top: 6mm; width: 27mm; height: 27mm; border-radius: 7mm; background: linear-gradient(145deg,#2c2e33,#17181b); box-shadow: inset 0 0 0 .35mm rgba(255,255,255,.12), 0 .6mm 1.2mm rgba(0,0,0,.5); }
.obj { position: absolute; width: 11mm; height: 11mm; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #4a5a78 0 12%, #0b0d12 30% 55%, #2b2d33 58% 64%, #0d0e10 66%); box-shadow: 0 0 0 .5mm #3a3c41, 0 0 0 .9mm #0f1012; }
.o1 { left: 2.2mm; top: 2.2mm; } .o2 { left: 2.2mm; top: 13.8mm; } .o3 { left: 13.8mm; top: 8mm; }
.flash { position: absolute; left: 17.6mm; top: 2.6mm; width: 3mm; height: 3mm; border-radius: 50%; background: radial-gradient(#fff6d8, #c9b98a); }
.marque { position: absolute; left: 50%; top: 58mm; width: 34mm; transform: translateX(-50%); }
.marque-sous { position: absolute; left: 0; right: 0; top: 74mm; text-align: center; font: 500 5pt "IBM Plex Mono", monospace; letter-spacing: .22em; text-transform: uppercase; color: rgba(255,255,255,.45); }
.dos .bas { position: absolute; left: 0; right: 0; bottom: 9mm; text-align: center; font: 500 5.2pt "IBM Plex Mono", monospace; letter-spacing: .14em; color: rgba(255,255,255,.4); }

/* ---------- Extérieur : écran verrouillé ---------- */
.ecran { background: #0d0d10; padding: 1.6mm; }
.vitre { position: relative; height: 100%; border-radius: 9.6mm; overflow: hidden; color: #fff;
  background: radial-gradient(90% 55% at 70% 85%, rgba(245,179,27,.85) 0%, rgba(245,179,27,0) 70%), radial-gradient(70% 40% at 15% 30%, rgba(19,168,154,.55) 0%, rgba(19,168,154,0) 70%), linear-gradient(180deg,#141a2a 0%,#20253a 45%,#3a2a1a 100%); }
.vitre .chev { position: absolute; right: -14mm; bottom: -6mm; width: 70mm; opacity: .16; }
.ilot { position: absolute; left: 50%; top: 3mm; width: 19mm; height: 5.2mm; margin-left: -9.5mm; border-radius: 3mm; background: #000; }
.statut { position: absolute; left: 7mm; right: 6.5mm; top: 3.6mm; display: flex; justify-content: space-between; font-weight: 600; font-size: 6pt; }
.cadenas { position: absolute; left: 50%; top: 11mm; transform: translateX(-50%); font-size: 7pt; opacity: .9; }
.date { position: absolute; left: 0; right: 0; top: 16mm; text-align: center; font-weight: 600; font-size: 7.4pt; opacity: .9; }
.heure { position: absolute; left: 0; right: 0; top: 19mm; text-align: center; font-weight: 700; font-size: 44pt; letter-spacing: -.03em; line-height: 1; }
.notifs { position: absolute; left: 4mm; right: 4mm; top: 52mm; display: grid; gap: 2.2mm; }
.notif { display: grid; grid-template-columns: 7.5mm 1fr; gap: 2.4mm; align-items: start; padding: 2.6mm 3mm; border-radius: 4.5mm; background: rgba(245,245,250,.20); box-shadow: inset 0 0 0 .2mm rgba(255,255,255,.18); }
.notif .ic { width: 7.5mm; height: 7.5mm; border-radius: 2mm; display: grid; place-items: center; font: 13pt/1 "Noto Color Emoji"; }
.notif .tete { display: flex; justify-content: space-between; font-weight: 700; font-size: 6.3pt; }
.notif .tete span { font-weight: 500; opacity: .7; }
.notif p { font-size: 6.6pt; line-height: 1.3; margin-top: .5mm; opacity: .95; }
.notif.neam { background: rgba(255,255,255,.92); color: #121214; }
.notif.neam .ic { background: #0f0f10; }
.notif.neam .ic img { width: 5.6mm; }
.ouvrir { position: absolute; left: 0; right: 0; bottom: 9mm; text-align: center; font-weight: 600; font-size: 7.2pt; letter-spacing: .02em; }
.ouvrir b { color: #f5b31b; }
.barre { position: absolute; left: 50%; bottom: 3.5mm; width: 24mm; height: 1.1mm; margin-left: -12mm; border-radius: 1mm; background: #fff; opacity: .85; }

/* ---------- Intérieur ---------- */
.int { background: #0d0d10; padding: 1.6mm; }
.int .vitre { background: linear-gradient(180deg,#fffdf8,#f7efe0); color: #121214; }
.int .statut { color: #121214; }
.g .contenu { position: absolute; left: 6mm; right: 6mm; top: 13mm; }
.sur { font: 500 5.4pt "IBM Plex Mono", monospace; letter-spacing: .14em; text-transform: uppercase; color: #9a6400; }
.int h2 { font-weight: 700; font-size: 15pt; line-height: 1.02; letter-spacing: -.03em; margin-top: 1.6mm; }
.int h2 em { font-family: "Instrument Serif", Georgia, serif; font-style: italic; font-weight: 400; color: #9a6400; }
.apps { margin-top: 6mm; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4.2mm 2mm; }
.app { text-align: center; }
.app i { display: grid; place-items: center; width: 13mm; height: 13mm; margin: 0 auto; border-radius: 3.6mm; font: 19pt/1 "Noto Color Emoji"; font-style: normal; box-shadow: 0 .6mm 1.4mm rgba(60,40,10,.18); }
.app span { display: block; margin-top: 1.2mm; font-weight: 600; font-size: 5.6pt; line-height: 1.15; color: #2b2a2c; }
.dock { position: absolute; left: 4mm; right: 4mm; bottom: 7mm; border-radius: 6mm; background: rgba(15,15,16,.06); padding: 2.6mm 4mm; font-size: 6.2pt; line-height: 1.35; color: #3c3c40; text-align: center; }
.dock b { color: #121214; }
.d .contenu { position: absolute; left: 6mm; right: 6mm; top: 13mm; text-align: center; }
.d .logo { width: 30mm; display: block; margin: 0 auto; }
.d h2 { margin-top: 5mm; font-size: 13.5pt; }
.d .txt { margin-top: 2.6mm; font-size: 6.8pt; line-height: 1.4; color: #4a4a50; }
.d .qrb { margin: 4.5mm auto 0; width: 34mm; padding: 3mm; background: #fff; border-radius: 4mm; box-shadow: 0 .8mm 2mm rgba(60,40,10,.15); }
.d .qrb img { width: 100%; display: block; }
.d .scan { margin-top: 2mm; font-weight: 700; font-size: 7.6pt; }
.d .scan b { background: linear-gradient(transparent 58%, #f5b31b 58%, #f5b31b 92%, transparent 92%); }
.d .coord { position: absolute; left: 4mm; right: 4mm; bottom: 7mm; border-radius: 6mm; background: #0f0f10; color: #fff; padding: 2.6mm 3mm; font-size: 6pt; line-height: 1.45; }
.d .coord span { color: #f5b31b; }
.apercu { margin: 8mm; position: relative; display: inline-block; vertical-align: top; }
.apercu .decoupe, .apercu .pli { display: none; }
.apercu .forme.seul { grid-template-columns: 70mm; }
</style></head><body>

<template id="exterieur">
  <div class="forme">
    <div class="panneau dos">
      <div class="photo"><div class="obj o1"></div><div class="obj o2"></div><div class="obj o3"></div><div class="flash"></div></div>
      <img class="marque" src="../../assets/logo-dark.png" alt="NEAM">
      <div class="bas">Designed in Libreville</div>
    </div>
    <div class="panneau ecran"><div class="vitre">
      <svg class="chev" viewBox="0 0 64 64"><path d="M32 12 54 50H42L32 32 22 50H10Z" fill="#f5b31b"/></svg>
      <div class="ilot"></div>
      <div class="statut"><span>08:00</span><span>▮▮▮ 4G ▭</span></div>
      <div class="cadenas">🔒</div>
      <div class="date">Lundi</div>
      <div class="heure">08:00</div>
      <div class="notifs">
        <div class="notif"><div class="ic" style="background:#25d366">💬</div><div><div class="tete">WhatsApp<span>maintenant</span></div><p>« Bonjour, vous avez un site&#8239;? Je voudrais commander. »</p></div></div>
        <div class="notif"><div class="ic" style="background:#fff">📍</div><div><div class="tete">Google<span>il y a 2 min</span></div><p>Quelqu’un cherche votre métier à Libreville, près de chez vous.</p></div></div>
        <div class="notif neam"><div class="ic"><img src="../../assets/logo-dark.png" alt=""></div><div><div class="tete">NEAM<span>à l’instant</span></div><p><b>Vos clients vous cherchent en ligne.</b> Ils vous trouvent&#8239;?</p></div></div>
      </div>
      <div class="ouvrir">Ouvrez pour <b>déverrouiller</b> →</div>
      <div class="barre"></div>
    </div></div>
  </div>
  <div class="decoupe"></div><div class="pli"></div>
</template>

<template id="interieur">
  <div class="forme">
    <div class="panneau int g"><div class="vitre">
      <div class="ilot"></div>
      <div class="statut"><span>08:01</span><span>▮▮▮ 4G ▭</span></div>
      <div class="contenu">
        <p class="sur">🔓 Déverrouillé</p>
        <h2>Tout pour être <em>trouvé</em> et <em>choisi</em>.</h2>
        <div class="apps">
          <div class="app"><i style="background:#fff">📍</i><span>Fiche Google</span></div>
          <div class="app"><i style="background:#e8f1ff">🌐</i><span>Site web<br>qui vend</span></div>
          <div class="app"><i style="background:#ffe9f0">📱</i><span>Réseaux<br>sociaux</span></div>
          <div class="app"><i style="background:#fff4d6">🎨</i><span>Identité<br>visuelle</span></div>
          <div class="app"><i style="background:#ffe8dc">🎬</i><span>Vidéos<br>courtes</span></div>
          <div class="app"><i style="background:#e6f7f2">🎯</i><span>Publicité<br>en ligne</span></div>
          <div class="app"><i style="background:#eef0f4">🤖</i><span>IA &amp;<br>WhatsApp</span></div>
          <div class="app"><i style="background:#f1ecff">📊</i><span>Suivi des<br>résultats</span></div>
          <div class="app"><i style="background:#fff">💳</i><span>Paiement<br>Mobile Money</span></div>
        </div>
      </div>
      <div class="dock">L’agence qui accompagne <b>les PME et les TPE</b> du Gabon dans leur croissance.</div>
      <div class="barre" style="background:#121214"></div>
    </div></div>
    <div class="panneau int d"><div class="vitre">
      <div class="ilot"></div>
      <div class="statut"><span>08:01</span><span>▮▮▮ 4G ▭</span></div>
      <div class="contenu">
        <img class="logo" src="../../assets/logo-light.png" alt="NEAM Softwares Industry">
        <h2>Votre entreprise est-elle <em>vraiment</em> visible&#8239;?</h2>
        <p class="txt">Faites le <b>NEAM Digital Score</b> : le diagnostic gratuit de votre présence en ligne, avec un plan d’action.</p>
        <div class="qrb"><img src="qr-score.svg" alt="QR code vers le NEAM Digital Score"></div>
        <p class="scan">Scannez, c’est <b>gratuit</b></p>
      </div>
      <div class="coord">🌐 <span>neamindustry.com</span><br>💬 WhatsApp <span>+241 77453167</span><br>📍 Louis, Libreville</div>
      <div class="barre" style="background:#fff;opacity:.0"></div>
    </div></div>
  </div>
  <div class="decoupe"></div><div class="pli"></div>
</template>

<section class="page" id="p1"><p class="note">RECTO — extérieur · impression recto verso, retournement bord long · découper sur les pointillés, plier au milieu</p></section>
<section class="page" id="p2"><p class="note">VERSO — intérieur</p></section>
<div id="apercus">
  <div class="apercu" id="ap-ferme"></div>
  <div class="apercu" id="ap-dos"></div>
  <div class="apercu" id="ap-ouvert"></div>
</div>
<script>
  const ext = document.getElementById('exterieur'), int = document.getElementById('interieur');
  for (const [page, t] of [['p1', ext], ['p2', int]]) for (const c of ['c1', 'c2']) {
    const el = document.createElement('div'); el.className = 'carte ' + c; el.appendChild(t.content.cloneNode(true));
    document.getElementById(page).appendChild(el);
  }
  // Aperçus : carte fermée (écran), dos, carte ouverte
  const ferme = ext.content.cloneNode(true); const fF = ferme.querySelector('.forme'); fF.classList.add('seul'); fF.querySelector('.dos').remove();
  const ap1 = document.getElementById('ap-ferme'); ap1.style.cssText = 'width:70mm;height:140mm'; ap1.appendChild(ferme); ap1.querySelector('.forme').style.borderRadius = '11mm';
  const dos = ext.content.cloneNode(true); const fD = dos.querySelector('.forme'); fD.classList.add('seul'); fD.querySelector('.ecran').remove();
  const ap2 = document.getElementById('ap-dos'); ap2.style.cssText = 'width:70mm;height:140mm'; ap2.appendChild(dos);
  const ap3 = document.getElementById('ap-ouvert'); ap3.style.cssText = 'width:140mm;height:140mm'; ap3.appendChild(int.content.cloneNode(true));
</script>
</body></html>
