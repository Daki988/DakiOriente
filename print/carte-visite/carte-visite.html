<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>NEAM — Carte de visite Daril OYE MBA</title>
<link rel="stylesheet" href="../catalogue/fonts/fonts.css">
<style>
/* Carte 85 × 55 mm + 3 mm de fond perdu = 91 × 61 mm ; zone sûre à 4 mm du trait de coupe */
@page { size: 91mm 61mm; margin: 0; }
:root { --ink: #0f0f10; --paper: #fff; --text: #3c3c40; --muted: #76767c; --line: #e3e3e0; --yellow: #f5b31b;
  --sans: "Instrument Sans", "Helvetica Neue", Arial, sans-serif; --mono: "IBM Plex Mono", Menlo, monospace; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
body { background: #8a8a8e; font-family: var(--sans); }
.face { position: relative; width: 91mm; height: 61mm; overflow: hidden; break-after: page; }
.face:last-child { break-after: auto; }
.sur { position: absolute; inset: 3mm; } /* format fini 85 × 55 */

/* ---------- Recto : fond encre, logo HD ---------- */
.recto { background: var(--ink); }
.recto .chev { position: absolute; right: -14mm; bottom: -27mm; width: 56mm; opacity: .07; }
.recto .chev path { fill: #fff; }
.recto .logo { position: absolute; left: 50%; top: 45%; width: 60mm; transform: translate(-50%, -50%); display: block; }
.recto .pied { position: absolute; left: 7mm; right: 7mm; bottom: 7mm; display: flex; align-items: center; gap: 2.4mm;
  font: 500 5.6pt var(--mono); letter-spacing: .16em; text-transform: uppercase; color: rgba(255,255,255,.62); }
.recto .pied::before { content: ""; width: 7mm; height: .45mm; background: var(--yellow); }
.recto .bande { position: absolute; left: 0; right: 0; bottom: 0; height: 4.6mm; background: var(--yellow); }

/* ---------- Verso : coordonnées ---------- */
.verso { background: var(--paper); color: var(--ink); }
.verso .bande { position: absolute; left: 0; top: 0; bottom: 0; width: 5.4mm; background: var(--yellow); }
.verso .bande::after { content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: .9mm; background: var(--ink); }
.verso .contenu { position: absolute; left: 10.4mm; top: 7.4mm; right: 7mm; bottom: 7mm; }
.verso .marque { position: absolute; right: 0; top: 0; width: 17mm; }
.verso .nom { font-weight: 600; font-size: 13pt; letter-spacing: -.03em; line-height: 1; }
.verso .nom b { font-weight: 700; }
.verso .titre { margin-top: 1.6mm; font: 500 5.7pt var(--mono); letter-spacing: .15em; text-transform: uppercase; color: var(--muted); }
.verso .titre::before { content: ""; display: inline-block; width: 4mm; height: .45mm; background: var(--yellow); vertical-align: middle; margin: -.3mm 1.6mm 0 0; }
.verso ul { list-style: none; position: absolute; left: 0; bottom: 0; display: grid; gap: 1.25mm; }
.verso li { display: grid; grid-template-columns: 3.4mm auto; align-items: center; gap: 1.8mm; font-size: 6.5pt; line-height: 1.2; color: var(--text); }
.verso li svg { width: 3.4mm; height: 3.4mm; }
.verso li .ic { fill: none; stroke: var(--ink); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.verso li strong { color: var(--ink); font-weight: 600; }
.verso li small { font: 500 4.9pt var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-right: 1mm; }
.verso .qr { position: absolute; right: 0; bottom: 0; width: 15mm; text-align: center; }
.verso .qr img { width: 15mm; height: 15mm; display: block; }
.verso .qr span { display: block; margin-top: 1mm; font: 500 4.2pt var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.verso .rond { fill: var(--yellow); }
</style>
</head>
<body>

<!-- RECTO -->
<section class="face recto">
  <svg class="chev" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 12 54 50H42L32 32 22 50H10Z"/></svg>
  <img class="logo" src="../../assets/logo-dark.png" alt="NEAM Softwares Industry">
  <div class="pied">www.neamindustry.com</div>
  <div class="bande"></div>
</section>

<!-- VERSO -->
<section class="face verso">
  <div class="bande"></div>
  <div class="contenu">
    <img class="marque" src="../../assets/logo-light.png" alt="NEAM">
    <p class="nom"><b>OYE MBA</b> Daril</p>
    <p class="titre">Fondateur &amp; Gérant</p>
    <ul>
      <li><svg viewBox="0 0 24 24"><path class="ic" d="M3 7.5 12 13l9-5.5M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z"/></svg><span><strong>daril.o@neamindustry.com</strong></span></li>
      <li><svg viewBox="0 0 24 24"><path class="ic" d="M5 3.5h3.5l1.8 4.6-2.3 1.5a11 11 0 0 0 6.4 6.4l1.5-2.3 4.6 1.8V19a1.5 1.5 0 0 1-1.6 1.5A16.5 16.5 0 0 1 3.5 5.1 1.5 1.5 0 0 1 5 3.5Z"/></svg><span><small>Tél.</small><strong>+241 60229447</strong></span></li>
      <li><svg viewBox="0 0 24 24"><path class="ic" d="M4 20.5 5.3 16A8.5 8.5 0 1 1 8.4 19l-4.4 1.5Z"/><path class="ic" d="M9.2 8.6c.2 2.9 2.4 5.1 5.4 5.9l1.1-1.2-1.9-1-1 .9c-1-.4-1.8-1.2-2.3-2.3l.9-1-1-1.9Z" style="stroke-width:1.2"/></svg><span><small>WhatsApp</small><strong>+241 77453167</strong></span></li>
      <li><svg viewBox="0 0 24 24"><path class="ic" d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11Z"/><circle class="ic" cx="12" cy="10" r="2.3"/></svg><span>Louis, avant l’ambassade de Côte d’Ivoire<br>Libreville, Gabon</span></li>
      <li><svg viewBox="0 0 24 24"><circle class="ic" cx="12" cy="12" r="8.5"/><path class="ic" d="M3.5 12h17M12 3.5c2.4 2.4 3.6 5.2 3.6 8.5s-1.2 6.1-3.6 8.5c-2.4-2.4-3.6-5.2-3.6-8.5S9.6 5.9 12 3.5Z"/></svg><span><strong>www.neamindustry.com</strong></span></li>
    </ul>
    <div class="qr"><img src="qr-site.svg" alt="QR code vers www.neamindustry.com"><span>Notre site</span></div>
  </div>
</section>

</body>
</html>
