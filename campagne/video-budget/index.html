<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>NEAM — Budget du client (vidéo verticale)</title>
<link rel="stylesheet" href="../../print/catalogue/fonts/fonts.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: "Instrument Sans", Arial, sans-serif; color: #0f0f10; }
  .layer { position: absolute; inset: 0; }
  #scene { background: linear-gradient(#f1e9da 0%, #ece2cf 71.3%, #e3d6bd 71.3%, #dccdb1 100%); }
  svg { position: absolute; inset: 0; width: 1080px; height: 1920px; }
  #top { position: absolute; left: 0; right: 0; top: 250px; display: grid; justify-items: center; gap: 22px; text-align: center; }
  #title { font-size: 76px; font-weight: 700; letter-spacing: -.035em; line-height: 1; }
  #title em { font-family: "Instrument Serif", Georgia, serif; font-style: italic; font-weight: 400; }
  #priceWrap { position: relative; height: 150px; width: 1000px; }
  .price { position: absolute; left: 50%; top: 0; transform: translateX(-50%); white-space: nowrap; background: #f5b31b; color: #0f0f10; border-radius: 28px; padding: 14px 40px 18px; font-size: 104px; font-weight: 700; letter-spacing: -.045em; line-height: 1.1; box-shadow: 0 18px 40px -20px rgba(0,0,0,.45); }
  .price small { display: block; font-size: 30px; letter-spacing: .02em; font-weight: 600; margin-bottom: -6px; text-transform: uppercase; }
  .price--quote { font-family: "Instrument Serif", Georgia, serif; font-style: italic; font-weight: 400; font-size: 76px; letter-spacing: -.01em; padding: 22px 40px 26px; background: #fff; }
  #count { font: 500 30px "IBM Plex Mono", monospace; letter-spacing: .06em; text-transform: uppercase; color: #5b5b62; }
  #twist { background: #0f0f10; display: grid; place-content: center; text-align: center; gap: 18px; color: #fff; }
  #twist p { font-size: 88px; font-weight: 700; letter-spacing: -.045em; line-height: 1.02; }
  #twist em { font-family: "Instrument Serif", Georgia, serif; font-style: italic; font-weight: 400; color: #f5b31b; font-size: 116px; }
  #end { background: #0f0f10; color: #fff; display: grid; align-content: center; justify-items: center; gap: 46px; text-align: center; padding: 0 70px; }
  #end img { width: 620px; }
  #end h2 { font-size: 82px; font-weight: 700; letter-spacing: -.045em; line-height: 1.02; }
  #end h2 em { font-family: "Instrument Serif", Georgia, serif; font-style: italic; font-weight: 400; color: #f5b31b; }
  #end .from { font-size: 40px; color: #d0d0d4; }
  #end .from b { display: block; color: #f5b31b; font-size: 92px; letter-spacing: -.04em; line-height: 1.05; }
  #end .cta { background: #f5b31b; color: #0f0f10; border-radius: 60px; padding: 26px 48px; font-size: 44px; font-weight: 700; letter-spacing: -.02em; }
  #end .contact { font: 500 30px "IBM Plex Mono", monospace; letter-spacing: .03em; color: #bdbdc2; line-height: 1.6; }
  #end .tag { font: 500 28px "IBM Plex Mono", monospace; color: #f5b31b; }
</style>
</head>
<body>
<div id="stage">
  <div class="layer" id="scene">
    <svg viewBox="0 0 1080 1920" aria-hidden="true">
      <!-- Façade : porte en arche et enseigne -->
      <g opacity=".95" transform="translate(0 180)">
        <path d="M230 1190 V720 A310 260 0 0 1 850 720 V1190 Z" fill="#d9ccb3"/>
        <path d="M262 1190 V728 A278 232 0 0 1 818 728 V1190 Z" fill="#26211c"/>
        <path d="M540 520 V1190" stroke="#3a322a" stroke-width="10"/>
        <g fill="none" stroke="#3a322a" stroke-width="6"><rect x="300" y="760" width="200" height="190" rx="8"/><rect x="580" y="760" width="200" height="190" rx="8"/><rect x="300" y="980" width="200" height="190" rx="8"/><rect x="580" y="980" width="200" height="190" rx="8"/></g>
        <rect x="430" y="604" width="220" height="64" rx="12" fill="#0f0f10"/>
        <text x="540" y="648" text-anchor="middle" font-family="Instrument Sans" font-weight="700" font-size="40" fill="#fff" letter-spacing="2">NEAM</text>
        <path d="M528 642 540 626 552 642h-6l-6-8-6 8z" fill="#f5b31b"/>
      </g>
      <!-- Sol -->
      <g stroke="#cfbf9f" stroke-width="3" opacity=".7"><path d="M0 1440 H1080"/><path d="M0 1560 H1080"/><path d="M0 1740 H1080"/><path d="M540 1370 L-300 1920M540 1370 L1380 1920M540 1370 L220 1920M540 1370 L860 1920"/></g>
    </svg>
    <svg id="team" viewBox="0 0 1080 1920"></svg>
    <div id="top">
      <div id="title">Budget du client</div>
      <div id="priceWrap"></div>
      <div id="count"></div>
    </div>
  </div>
  <div class="layer" id="twist"><p id="tw1">Et si 150&nbsp;000&nbsp;FCFA</p><p id="tw2">par mois vous offraient</p><p id="tw3"><em>toute l’équipe&nbsp;?</em></p></div>
  <div class="layer" id="end">
    <img src="../../assets/logo-dark.png" alt="NEAM Softwares Industry">
    <h2>Toute une équipe digitale,<br><em>pour le prix d’un seul prestataire.</em></h2>
    <p class="from">À partir de<b>150&nbsp;000 FCFA / mois</b></p>
    <span class="cta">Diagnostic digital gratuit →</span>
    <p class="contact">neamindustry.com<br>WhatsApp · 077 45 31 67</p>
    <span class="tag">#EtÇaRapporteCombien</span>
  </div>
</div>
<script>
const NS = 'http://www.w3.org/2000/svg';
const DUR = 29;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const backOut = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const ease = x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
const SHIRT = '#17171b', PANTS = '#2b2b31', HAIR = '#16100d';

// Les 7 prestataires : rôle, accessoire, coiffure, teint, position, échelle, départ
const TEAM = [
  { role: 'Vidéaste', prop: 'camera', hair: 'short', skin: '#5a3622', x: 160, y: 1410, s: 1.05, out: 2.5 },
  { role: 'Designer', prop: 'tablet', hair: 'bun', skin: '#8d5a3b', x: 410, y: 1410, s: 1.05, out: 4.5 },
  { role: 'Expert IA', prop: 'ia', hair: 'fade', skin: '#3d2516', x: 670, y: 1410, s: 1.05, out: 2.5 },
  { role: 'Expert SEO', prop: 'seo', hair: 'braids', skin: '#a0694a', x: 920, y: 1410, s: 1.05, out: 4.5 },
  { role: 'Chef de projet', prop: 'clipboard', hair: 'afro', skin: '#6b4226', x: 225, y: 1580, s: 1.18, out: 6.5 },
  { role: 'Community manager', prop: 'phone', hair: 'bun2', skin: '#7a4a2e', x: 540, y: 1580, s: 1.18, out: 12.9 },
  { role: 'Développeur web', prop: 'laptop', hair: 'short', skin: '#4b2e1e', x: 855, y: 1580, s: 1.18, out: 8.5 },
];
const BACK = [0, 1, 2, 3];

const PRICES = [[0, '3 000 000 FCFA', 7], [2.5, '1 500 000 FCFA', 5], [4.5, '750 000 FCFA', 3], [6.5, '300 000 FCFA', 2], [8.5, '150 000 FCFA', 1], [10.5, '50 000 FCFA', 1], [12.5, '« On vous paiera en visibilité »', 0]];

function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
const svgFrag = (g, html) => { g.insertAdjacentHTML('beforeend', html); };

function hair(style) {
  switch (style) {
    case 'short': return `<path d="M-40 -372 A40 40 0 0 1 40 -372 Q20 -392 -40 -372Z" fill="${HAIR}"/><path d="M-41 -370 A41 44 0 0 1 41 -370 L38 -380 A38 34 0 0 0 -38 -380Z" fill="${HAIR}"/>`;
    case 'fade': return `<path d="M-40 -368 A40 40 0 0 1 40 -368 A40 30 0 0 0 -40 -368Z" fill="${HAIR}" opacity=".9"/>`;
    case 'afro': return `<circle cx="0" cy="-382" r="52" fill="${HAIR}"/>`;
    case 'bun': return `<circle cx="0" cy="-418" r="20" fill="${HAIR}"/><path d="M-41 -364 A41 44 0 0 1 41 -364 A41 30 0 0 0 -41 -364Z" fill="${HAIR}"/>`;
    case 'bun2': return `<circle cx="18" cy="-414" r="18" fill="${HAIR}"/><path d="M-41 -362 A41 44 0 0 1 41 -362 A41 28 0 0 0 -41 -362Z" fill="${HAIR}"/>`;
    case 'braids': return `<path d="M-41 -364 A41 44 0 0 1 41 -364 A41 28 0 0 0 -41 -364Z" fill="${HAIR}"/><rect x="-50" y="-372" width="16" height="96" rx="8" fill="${HAIR}"/><rect x="34" y="-372" width="16" height="96" rx="8" fill="${HAIR}"/>`;
  }
  return '';
}
function arms(a, skin) {
  // a : [[épaule gauche → main gauche], [épaule droite → main droite]]
  return a.map(([x1, y1, x2, y2]) => `<path d="M${x1} ${y1} L${x2} ${y2}" stroke="${SHIRT}" stroke-width="26" stroke-linecap="round"/>`).join('');
}
const hands = (pts, skin) => pts.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="13" fill="${skin}"/>`).join('');
function prop(kind, skin) {
  const chest = [[-46, -288, -46, -214], [46, -288, 46, -214]];
  switch (kind) {
    case 'laptop': return arms(chest) + `<rect x="-66" y="-300" width="132" height="84" rx="7" fill="#2c2c32"/><rect x="-58" y="-292" width="116" height="68" rx="3" fill="#f5b31b"/><path d="M-44 -276h52M-44 -262h70M-44 -248h40" stroke="#0f0f10" stroke-width="6" stroke-linecap="round" opacity=".55"/><rect x="-76" y="-218" width="152" height="12" rx="5" fill="#a3a3ab"/>` + hands([[-52, -212], [52, -212]], skin);
    case 'ia': return arms(chest) + `<rect x="-66" y="-300" width="132" height="84" rx="7" fill="#2c2c32"/><rect x="-58" y="-292" width="116" height="68" rx="3" fill="#101014"/><g stroke="#f5b31b" stroke-width="3"><path d="M-30 -276 0 -258 30 -276M-30 -240 0 -258 30 -240"/></g><g fill="#f5b31b"><circle cx="0" cy="-258" r="8"/><circle cx="-30" cy="-276" r="5"/><circle cx="30" cy="-276" r="5"/><circle cx="-30" cy="-240" r="5"/><circle cx="30" cy="-240" r="5"/></g><rect x="-76" y="-218" width="152" height="12" rx="5" fill="#a3a3ab"/>` + hands([[-52, -212], [52, -212]], skin);
    case 'camera': return arms([[-46, -288, -54, -238], [46, -288, 54, -238]]) + `<rect x="-22" y="-288" width="44" height="18" rx="5" fill="#111"/><rect x="-56" y="-274" width="112" height="70" rx="12" fill="#111"/><circle cx="0" cy="-239" r="28" fill="#2d2d33"/><circle cx="0" cy="-239" r="16" fill="#0a0a0c"/><circle cx="6" cy="-245" r="5" fill="#f5b31b" opacity=".8"/>` + hands([[-58, -236], [58, -236]], skin);
    case 'tablet': return arms([[-46, -288, -40, -222], [46, -288, 34, -250]]) + `<rect x="-62" y="-296" width="112" height="80" rx="9" fill="#1e1e22"/><rect x="-55" y="-289" width="98" height="66" rx="4" fill="#cdbdf3"/><path d="M-40 -240 Q-14 -284 22 -258" stroke="#5b3fd1" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M34 -250 L62 -300" stroke="#f5b31b" stroke-width="7" stroke-linecap="round"/>` + hands([[-40, -220], [34, -250]], skin);
    case 'clipboard': return arms([[-46, -288, -36, -222], [46, -288, 40, -262]]) + `<rect x="-46" y="-306" width="92" height="114" rx="7" fill="#b5835a"/><rect x="-38" y="-292" width="76" height="94" fill="#fff"/><rect x="-18" y="-312" width="36" height="16" rx="5" fill="#6e6e76"/><g stroke="#0c7d72" stroke-width="5" stroke-linecap="round" fill="none"><path d="M-30 -272l6 6 10-12M-30 -244l6 6 10-12M-30 -216l6 6 10-12"/></g><path d="M-4 -268h30M-4 -240h30M-4 -212h24" stroke="#9a9aa2" stroke-width="5" stroke-linecap="round"/>` + hands([[-36, -220], [40, -262]], skin);
    case 'seo': return arms([[-46, -288, -50, -226], [46, -288, 50, -226]]) + `<rect x="-64" y="-312" width="128" height="96" rx="9" fill="#fff" stroke="#17171b" stroke-width="4"/><g fill="#f5b31b"><rect x="-48" y="-252" width="16" height="24"/><rect x="-26" y="-266" width="16" height="38"/><rect x="-4" y="-282" width="16" height="54"/></g><circle cx="34" cy="-276" r="14" fill="none" stroke="#17171b" stroke-width="5"/><path d="M44 -266l10 10" stroke="#17171b" stroke-width="6" stroke-linecap="round"/>` + hands([[-52, -222], [52, -222]], skin);
    case 'phone': return arms([[-46, -288, -60, -176], [46, -288, 36, -238]]) + `<rect x="20" y="-300" width="38" height="66" rx="8" fill="#111"/><rect x="24" y="-294" width="30" height="52" rx="4" fill="#f5b31b"/>` + hands([[-62, -172], [36, -236]], skin);
  }
  return '';
}

const team = document.getElementById('team');
let CH = [], PRICE_EL = [], FINAL_PRICE = null;
function build() {
CH = TEAM.map((c, i) => {
  const g = el('g', {}, team);
  const shadow = el('ellipse', { cx: 0, cy: 0, rx: 74, ry: 14, fill: 'rgba(60,40,10,.18)' }, g);
  const body = el('g', {}, g);
  svgFrag(body, `<rect x="-32" y="-168" width="26" height="168" rx="13" fill="${PANTS}"/><rect x="6" y="-168" width="26" height="168" rx="13" fill="${PANTS}"/>
    <rect x="-40" y="-14" width="36" height="16" rx="8" fill="#0d0d0f"/><rect x="4" y="-14" width="36" height="16" rx="8" fill="#0d0d0f"/>
    <rect x="-56" y="-318" width="112" height="176" rx="38" fill="${SHIRT}"/>
    <path d="M-34 -288 -24 -302 -14 -288h-5l-5-7-5 7z" fill="#f5b31b"/>
    <rect x="-13" y="-338" width="26" height="30" rx="9" fill="${c.skin}"/>
    ${c.hair === 'afro' ? hair('afro') : ''}<circle cx="0" cy="-374" r="41" fill="${c.skin}"/>${c.hair !== 'afro' ? hair(c.hair) : ''}
    ${prop(c.prop, c.skin)}`);
  // Étiquette du rôle
  const lab = el('g', {}, g);
  const ly = BACK.includes(i) ? -470 : 70;
  const txt = el('text', { x: 0, y: ly + 12, 'text-anchor': 'middle', 'font-family': 'Instrument Sans', 'font-weight': 600, 'font-size': 24, fill: '#0f0f10' }, lab);
  txt.textContent = c.role;
  const w = Math.max(120, txt.getComputedTextLength() + 44);
  const rect = el('rect', { x: -w / 2, y: ly - 22, width: w, height: 46, rx: 23, fill: '#fff', stroke: 'rgba(15,15,16,.12)', 'stroke-width': 2 });
  lab.insertBefore(rect, txt);
  el('circle', { cx: -w / 2 + 18, cy: ly + 1, r: 6, fill: '#f5b31b' }, lab);
  txt.setAttribute('x', 8);
  // Petits nuages de disparition
  const poof = el('g', {}, g);
  const dots = [...Array(8)].map((_, k) => el('circle', { r: 16, fill: '#f5b31b', opacity: 0 }, poof));
  // Bulle (community manager)
  let bubble = null;
  if (c.prop === 'phone') {
    bubble = el('g', { opacity: 0 }, g);
    svgFrag(bubble, `<rect x="40" y="-560" width="120" height="96" rx="30" fill="#fff" stroke="rgba(15,15,16,.15)" stroke-width="3"/><path d="M70 -468 54 -440 92 -466z" fill="#fff"/><text x="100" y="-494" text-anchor="middle" font-family="Instrument Sans" font-weight="700" font-size="58" fill="#0f0f10">?</text>`);
  }
  return { c, g, body, shadow, lab, dots, bubble };
});

// Prix : un élément par palier
const priceWrap = document.getElementById('priceWrap');
PRICE_EL = PRICES.map(([t, txt]) => {
  const d = document.createElement('div');
  d.className = 'price' + (txt.startsWith('«') ? ' price--quote' : '');
  d.textContent = txt;
  priceWrap.appendChild(d);
  return d;
});
FINAL_PRICE = document.createElement('div');
FINAL_PRICE.className = 'price';
FINAL_PRICE.innerHTML = '<small>à partir de</small>150 000 FCFA / mois';
priceWrap.appendChild(FINAL_PRICE);
}

const $ = id => document.getElementById(id);

function renderAt(t) {
  // ----- Scène 1 : le budget baisse, l'équipe disparaît -----
  const back = t >= 18.5;                        // retour de toute l'équipe avec NEAM
  $('title').innerHTML = back ? 'Avec <em>NEAM</em>' : 'Budget du client';
  let idx = 0;
  PRICES.forEach(([pt], k) => { if (t >= pt) idx = k; });
  PRICE_EL.forEach((d, k) => {
    const pt = PRICES[k][0];
    const on = !back && k === idx;
    const p = clamp((t - pt) / .28);
    d.style.opacity = on ? ease(p) : 0;
    const shake = (k === PRICES.length - 1 && on) ? Math.sin(t * 40) * 6 * clamp(1 - (t - pt) / .6) : 0;
    d.style.transform = `translateX(calc(-50% + ${shake}px)) translateY(${on ? (1 - ease(p)) * 50 : 0}px) scale(${on ? .92 + .08 * backOut(p) : 1})`;
  });
  const fp = clamp((t - 18.9) / .4);
  FINAL_PRICE.style.opacity = back ? fp : 0;
  FINAL_PRICE.style.transform = `translateX(-50%) scale(${back ? .8 + .2 * backOut(fp) : 1})`;
  const n = back ? 7 : PRICES[idx][2];
  $('count').textContent = back ? '7 prestataires · 1 seul prix' : (n === 0 ? 'Plus personne' : n === 1 ? '1 prestataire' : `${n} prestataires`);

  CH.forEach((o, i) => {
    const c = o.c;
    let sc = 1, op = 1, dx = 0, bob = Math.sin(t * 3.1 + i * 1.7) * 3;
    // départ
    if (!back) {
      if (c.prop === 'phone') {
        // le dernier marche vers la sortie
        const w = clamp((t - 13.1) / 1.4);
        dx = ease(w) * 640;
        bob = w > 0 && w < 1 ? -Math.abs(Math.sin(t * 12)) * 12 : bob;
        op = 1 - clamp((t - 14.1) / .4);
      } else {
        const v = clamp((t - c.out) / .35);
        sc = 1 - .45 * ease(v); op = 1 - v;
        o.dots.forEach((d, k) => {
          const a = (k / 8) * Math.PI * 2, r = 30 + 120 * ease(v);
          d.setAttribute('cx', Math.cos(a) * r); d.setAttribute('cy', -230 + Math.sin(a) * r);
          d.setAttribute('opacity', v > 0 && v < 1 ? (1 - v) * .9 : 0);
          d.setAttribute('r', 16 * (1 - v * .6));
        });
      }
    } else {
      // retour : chacun réapparaît, en cascade
      const order = [5, 4, 6, 1, 2, 0, 3].indexOf(i);
      const a = clamp((t - (18.55 + order * .13)) / .45);
      sc = a <= 0 ? 0 : backOut(a); op = a > 0 ? 1 : 0;
      o.dots.forEach(d => d.setAttribute('opacity', 0));
    }
    o.g.setAttribute('transform', `translate(${c.x + dx} ${c.y}) scale(${c.s})`);
    o.body.setAttribute('transform', `translate(0 ${bob}) scale(${sc}) `);
    o.body.setAttribute('transform-origin', '0 0');
    o.body.style.transformOrigin = '0px 0px';
    o.body.setAttribute('opacity', op);
    o.shadow.setAttribute('opacity', op);
    o.shadow.setAttribute('transform', `translate(${0} 0) scale(${sc})`);
    o.lab.setAttribute('opacity', op);
    o.lab.setAttribute('transform', `translate(0 0) scale(${Math.max(sc, .001)})`);
    if (o.bubble) {
      const b = !back ? clamp((t - 10.75) / .3) * (1 - clamp((t - 12.9) / .3)) : 0;
      o.bubble.setAttribute('opacity', b);
      o.bubble.setAttribute('transform', `translate(0 ${-8 * Math.sin(t * 4)}) scale(${.6 + .4 * backOut(clamp((t - 10.75) / .3))})`);
      // hésitation : la tête penche
      if (!back && t > 10.6 && t < 13.1) o.body.setAttribute('transform', `translate(0 ${bob}) rotate(${Math.sin((t - 10.6) * 5) * 4} 0 -200) scale(${sc})`);
    }
  });

  // ----- Scène 2 : la question -----
  const tw = clamp((t - 15) / .35) * (1 - clamp((t - 18.25) / .3));
  $('twist').style.opacity = tw;
  [['tw1', 15.3], ['tw2', 16.1], ['tw3', 16.8]].forEach(([id, st]) => {
    const p = clamp((t - st) / .4);
    $(id).style.opacity = p;
    $(id).style.transform = `translateY(${(1 - ease(p)) * 40}px)`;
  });
  // ----- Scène 3 : carte finale -----
  const e = clamp((t - 25) / .45);
  $('end').style.opacity = e;
  [...$('end').children].forEach((c, k) => {
    const p = clamp((t - 25.2 - k * .18) / .4);
    c.style.opacity = p;
    c.style.transform = `translateY(${(1 - ease(p)) * 36}px)`;
  });
}
window.renderAt = renderAt;
window.DUR = DUR;
document.fonts.ready.then(() => { build(); renderAt(0); window.READY = true; });
</script>
</body>
</html>
