<!doctype html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="commun.css"><style>
#fond { position:absolute; inset:0; }
.clair { background: radial-gradient(80% 60% at 30% 10%, #fffdf7, #efe6d2 70%, #e2d5b8); }
.fonce { background: radial-gradient(80% 60% at 70% 10%, #2b2b2f, #121214 60%, #0a0a0b); }
#mot { position:absolute; left:40px; right:40px; top:50%; transform:translateY(-50%); text-align:center; font-weight:700; font-size:120px; letter-spacing:-.045em; line-height:1; }
#mot small { display:block; font-size:70px; margin-bottom:-6px; }
#mot em { display:block; font-size:230px; color:#f5b31b; line-height:.9; }
#logo { position:absolute; left:50%; top:50%; width:620px; transform:translate(-50%,-50%); opacity:0; }
#sous { position:absolute; left:0; right:0; top:1120px; text-align:center; font: 500 30px var(--mono); letter-spacing:.16em; color:#6b6b70; opacity:0; }
</style></head><body>
<div id="fond"></div><div id="mot"></div>
<img id="logo" src="../../assets/logo-light.png" alt=""><p id="sous">WWW.NEAMINDUSTRY.COM</p>
<script>
// [début, fin, html, fond, flou d'entrée]
const M = [
 [0.0, 0.7, 'on', 'clair'], [0.7, 1.35, '<small>on</small>ne fait pas', 'fonce'], [1.35, 1.8, 'que', 'clair'],
 [1.8, 2.9, '<small>que</small><em>coder.</em>', 'fonce'], [2.9, 3.5, 'on', 'clair'], [3.5, 4.1, 'construit', 'fonce'],
 [4.1, 4.5, 'des sites', 'clair'], [4.5, 4.9, 'des marques', 'fonce'], [4.9, 5.3, 'de la visibilité', 'clair'],
 [5.3, 5.7, 'de la confiance', 'fonce'], [5.7, 6.1, 'des clients', 'clair'], [6.1, 6.5, 'des ventes', 'fonce'],
 [6.5, 7.0, 'de la croissance', 'clair'], [7.0, 7.9, '', 'fonce', 'Lancez-vous.'], [7.9, 10.5, 'LOGO', 'clair'] ];
window.seek = t => {
  const m = M.find(x => t >= x[0] && t < x[1]) || M[M.length - 1];
  const f = document.getElementById('fond'), w = document.getElementById('mot');
  f.className = m[3]; w.style.color = m[3] === 'clair' ? '#141416' : '#fff';
  const u = t - m[0];
  w.style.filter = `blur(${Math.max(0, 1 - u / .12) * 14}px)`; w.style.transform = `translateY(-50%) scale(${1 + Math.max(0, 1 - u / .15) * .08})`;
  const logo = document.getElementById('logo'), sous = document.getElementById('sous');
  if (m[2] === 'LOGO') {
    w.innerHTML = ''; const k = Math.min(1, u / .35);
    logo.style.opacity = k; logo.style.transform = `translate(-50%,-50%) scale(${.92 + .08 * k})`; sous.style.opacity = Math.min(1, Math.max(0, (u - .5) / .4));
  } else {
    logo.style.opacity = 0; sous.style.opacity = 0;
    if (m[4]) { const n = Math.min(m[4].length, Math.floor(u / .06)); w.innerHTML = m[4].slice(0, n) + (Math.floor(u / .25) % 2 ? '' : '<span style="color:#f5b31b">|</span>'); w.style.filter = 'none'; }
    else w.innerHTML = m[2];
  }
};
</script></body></html>
