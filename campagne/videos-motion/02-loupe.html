<!doctype html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="commun.css"><style>
body { background: #111113; }
.creme { position:absolute; inset:0; background: radial-gradient(90% 60% at 50% 40%, #f4f0e6, #e6e0d2); }
.noir { position:absolute; inset:0; background: radial-gradient(90% 60% at 50% 40%, #1d1d20, #0b0b0c); }
#balle { position:absolute; width:56px; height:56px; margin:-28px; border-radius:50%; background: radial-gradient(circle at 35% 30%, #ffe08a, #f5b31b 45%, #b97c00); box-shadow: 0 0 40px rgba(245,179,27,.7); }
#fil { position:absolute; width:3px; background:#2a2a2c; transform-origin: top center; }
.titre { position:absolute; left:70px; right:70px; top:760px; color:#1b1b1d; }
.titre b { display:block; font-weight:700; font-size:104px; letter-spacing:-.04em; line-height:1; }
.titre em { display:block; font-size:120px; color:#9a6400; line-height:1.1; }
.titre .l { display:inline-block; }
.rebond p { position:absolute; font-weight:700; font-size:76px; letter-spacing:-.03em; color:#fff; opacity:0; }
.marque { position:absolute; top:60px; left:60px; font: 500 22px var(--mono); letter-spacing:.14em; color:rgba(127,127,127,.6); }
.loupe-t { position:absolute; left:80px; top:380px; font-weight:700; font-size:78px; letter-spacing:-.04em; color:#1b1b1d; }
.code { position:absolute; left:80px; top:600px; width:920px; font: 400 31px/2 var(--mono); color:#9a978e; white-space:pre; }
.code i { font-style:normal; color:#6d6a62; }
#lentille { position:absolute; width:300px; height:300px; margin:-150px; border-radius:50%; overflow:hidden; border:10px solid #f5b31b; background:#f7f3ea; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
#lentille .code { left:0; top:0; width:1700px; color:#1b1b1d; font-size:54px; }
#lentille .code i { color:#9a6400; font-weight:500; }
#manche { position:absolute; width:26px; height:150px; border-radius:13px; background:#1b1b1d; transform-origin: top center; }
#revele { position:absolute; inset:0; display:grid; place-items:center; text-align:center; font: italic 400 64px/1 var(--serif); color:#9a6400; opacity:0; background:#fffaf0; }
#pilule { position:absolute; left:50%; top:900px; height:120px; border-radius:60px; background: linear-gradient(180deg,#ffc94a,#f5b31b); box-shadow:0 0 60px rgba(245,179,27,.45); transform:translateX(-50%); display:grid; place-items:center; color:#0f0f10; font-weight:700; font-size:40px; letter-spacing:.02em; white-space:nowrap; overflow:hidden; }
#carte { position:absolute; left:110px; right:110px; top:640px; height:560px; border-radius:44px; background: linear-gradient(180deg,#ffc94a,#f5b31b); box-shadow:0 0 90px rgba(245,179,27,.45); color:#0f0f10; text-align:center; display:flex; flex-direction:column; justify-content:center; gap:22px; opacity:0; }
#carte small { font-weight:600; font-size:34px; }
#carte em { font-size:150px; line-height:.9; }
#carte span { font-weight:600; font-size:38px; }
#signe { position:absolute; left:0; right:0; top:1330px; text-align:center; opacity:0; }
#signe img { width:300px; }
#signe p { margin-top:18px; font: 500 22px var(--mono); letter-spacing:.14em; color:rgba(255,255,255,.45); }
</style></head><body>
<section class="scene" id="s1"><div class="creme"></div>
  <div class="titre"><b id="t1"></b><em id="t2"></em></div>
</section>
<section class="scene" id="s2"><div class="noir"></div><div class="marque">@NEAM.INDUSTRY</div>
  <div class="rebond"><p id="r1" style="left:110px;top:520px">CHAQUE REBOND,</p><p id="r2" style="left:230px;top:640px">CHAQUE IMAGE,</p><p id="r3" style="left:350px;top:760px">CHAQUE DÉTAIL,</p></div>
</section>
<section class="scene" id="s3"><div class="creme"></div><div class="marque">@NEAM.INDUSTRY</div>
  <div class="loupe-t">REGARDEZ DE PLUS PRÈS.</div>
  <div class="code" id="code"></div>
  <div id="manche"></div>
  <div id="lentille"><div class="code" id="code2"></div><div id="revele">c’est du<br>code.</div></div>
</section>
<section class="scene" id="s4"><div class="noir"></div><div class="marque">@NEAM.INDUSTRY</div>
  <div id="pilule"><span id="ptxt">VOTRE SITE PEUT AUSSI BOUGER.</span></div>
  <div id="carte"><small>Sites web · Applis · Automatisation</small><em>NEAM</em><span>Lien en bio →</span></div>
  <div id="signe"><img src="../../assets/logo-dark.png" alt=""><p>FAIT EN CODE · LIBREVILLE</p></div>
</section>
<div id="fil"></div><div id="balle"></div>
<script>
const CODE = `<i>const</i> balle = ressort({ de: 0, vers: 1 });
<i>rebond</i>(balle, { hauteur: 1.25, amorti: 0.6 });
<i>scene</i>.ajouter(titre, { flou: 20, durée: 0.6 });
<i>pour</i> (const mot <i>of</i> [« rebond », « image »]) {
  apparaitre(mot, { décalage: 0.15 });
}
<i>loupe</i>.suivre(chemin, { zoom: 1.8 });
<i>const</i> client = visiteur.contacter(<i>"WhatsApp"</i>);
<i>site</i>.vitesse = <i>"rapide"</i>;
<i>bouton</i>.texte = <i>"Demander un devis"</i>;
exporter(<i>"reel.mp4"</i>, { i: 30, format: <i>"9:16"</i> });`;
document.getElementById('code').innerHTML = CODE; document.getElementById('code2').innerHTML = CODE;
const $ = id => document.getElementById(id);
const cl = (x, a, b) => Math.max(a, Math.min(b, x));
const e = x => 1 - Math.pow(1 - cl(x, 0, 1), 3);
const show = (id, on) => $(id).style.opacity = on ? 1 : 0;
const T1 = 'CETTE VIDÉO ?', T2 = 'Écrite en code.';
window.seek = t => {
  ['s1','s2','s3','s4'].forEach(s => show(s, false));
  const b = $('balle'), f = $('fil'); f.style.height = '0px'; b.style.opacity = 1;
  if (t < 4.2) {               // 1. balle au bout d'un fil qui balaie le titre
    show('s1', true);
    const ang = Math.sin(t * 2.2) * 38 * Math.exp(-t * .15), L = 900;
    const x = 540 + Math.sin(ang * Math.PI / 180) * L, y = -40 + Math.cos(ang * Math.PI / 180) * L;
    f.style.left = '540px'; f.style.top = '-40px'; f.style.height = L + 'px'; f.style.transform = `rotate(${-ang}deg)`;
    b.style.left = x + 'px'; b.style.top = y + 'px';
    const n1 = Math.floor(cl((t - .3) / 1.2, 0, 1) * T1.length), n2 = Math.floor(cl((t - 1.4) / 1.2, 0, 1) * T2.length);
    $('t1').textContent = T1.slice(0, n1); $('t2').textContent = T2.slice(0, n2);
    if (t > 3.7) { const k = e((t - 3.7) / .5); b.style.top = y + k * 1200 + 'px'; f.style.opacity = 1 - k; } else f.style.opacity = 1;
  } else if (t < 9.2) {        // 2. rebonds, un mot par rebond
    show('s2', true); const u = t - 4.2;
    const P = 1.15, ph = (u % P) / P, n = Math.floor(u / P);
    const x = 140 + u * 150, y = 1250 - Math.sin(ph * Math.PI) * (520 - n * 60);
    b.style.left = x + 'px'; b.style.top = y + 'px';
    ['r1','r2','r3'].forEach((id, i) => { const k = e((u - .55 - i * P) / .3); $(id).style.opacity = k; $(id).style.transform = `translateY(${(1 - k) * 30}px)`; });
    if (u > 4.4) b.style.opacity = 1 - (u - 4.4) / .6;
  } else if (t < 15.2) {       // 3. loupe sur le code
    show('s3', true); b.style.opacity = 0; const u = t - 9.2;
    const pts = [[300, 700], [720, 840], [400, 980], [760, 1120], [540, 930]];
    const seg = cl(u / 1.1, 0, pts.length - 1), i = Math.min(Math.floor(seg), pts.length - 2), k = (1 - Math.cos((seg - i) * Math.PI)) / 2;
    const x = pts[i][0] + (pts[i + 1][0] - pts[i][0]) * k, y = pts[i][1] + (pts[i + 1][1] - pts[i][1]) * k;
    const z = u > 4.4 ? 1 + e((u - 4.4) / .6) * .7 : 1;
    const L = $('lentille'); L.style.left = x + 'px'; L.style.top = y + 'px'; L.style.transform = `scale(${z})`;
    const m = $('manche'); m.style.left = (x + 95 * z) + 'px'; m.style.top = (y + 95 * z) + 'px'; m.style.transform = 'rotate(-45deg)';
    const c2 = $('code2'), Z = 54 / 31; c2.style.transform = `translate(${150 - (x - 80) * Z}px, ${150 - (y - 600) * Z}px)`; c2.style.transformOrigin = '0 0';
    $('revele').style.opacity = cl((u - 4.6) / .4, 0, 1);
  } else {                     // 4. pilule puis carte jaune
    show('s4', true); const u = t - 15.2;
    b.style.opacity = u < .5 ? 1 : 0; b.style.left = '540px'; b.style.top = (900 + 0) + 'px';
    const P = $('pilule'), w = 60 + e((u - .3) / .6) * 840; P.style.width = w + 'px';
    P.style.opacity = u < 2.6 ? 1 : 1 - e((u - 2.6) / .3);
    $('ptxt').style.opacity = cl((u - .9) / .3, 0, 1);
    const c = e((u - 2.7) / .5); $('carte').style.opacity = c; $('carte').style.transform = `scale(${.85 + .15 * c})`;
    $('signe').style.opacity = cl((u - 3.4) / .5, 0, 1);
  }
};
</script></body></html>
