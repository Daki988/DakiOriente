  <div style="margin:44px auto 0;width:${w}px;height:${h}px;border-radius:22px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.35);transform:rotate(-2deg);background:#222"><img src="${p.img}" style="width:100%;height:100%;object-fit:cover;display:block"></div>
  <div class="serif it" style="font-size:${p.title.length>34?58:72}px;line-height:1.05;margin-top:48px;text-align:center">${p.title}</div>`;
  p.cta='Sur le profil ↓';
 } else if(p.kind==='teaser'){cls='d';
  body=`<div class="mono gold" style="font-size:30px;margin-top:60px;color:var(--gold)">LANCEMENT · @NEAM.INDUSTRY</div>
  <div class="cond" style="font-size:520px;line-height:.8;margin-top:60px;color:var(--gold)">${p.label}</div>
  <div class="serif it" style="font-size:100px;line-height:1;margin-top:80px">${p.title}</div>
  <div class="lead" style="margin-top:50px;max-width:860px">${p.text}</div>`;
 } else {cls=THEMES[i%3];
  const long=p.title.length>44;
  body=`<div class="mono" style="font-size:30px;margin-top:60px">${p.label}</div>
  <div class="${long?'serif':'cond'}" style="font-size:${long?104:(p.title.length>26?150:190)}px;line-height:${long?1.02:.88};margin-top:60px">${p.title}</div>
  <div style="width:120px;height:8px;background:${cls==='g'?'#14161A':'#E2A11B'};margin:70px 0"></div>
  <div class="lead" style="font-size:50px;line-height:1.3;max-width:900px">${p.text}</div>`;
 }
 const c=cls==='d'?'#F3EEE3':'#14161A';
 return `<div class="s ${cls}" id="x${p.id}"><div class="hd mono"><span>@NEAM.INDUSTRY</span><span>${p.kind==='relay'?'NOUVEAU':'STORY'}</span></div><div class="body">${body}</div>
 <div class="ft">${logo(c)}${p.cta?`<span class="pill">${p.cta}</span>`:''}</div></div>`}).join('');
window.ready=Promise.all([document.fonts.ready,...[...document.images].map(im=>im.complete?1:new Promise(r=>{im.onload=im.onerror=r}))]).then(()=>new Promise(r=>setTimeout(r,500)));
</script></body></html>
