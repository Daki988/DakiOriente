<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>NEAM Atelier</title><link rel="icon" href="assets/brand/mark.svg"><link rel="stylesheet" href="assets/brand/atelier.css">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/engine.css"></head>
<body data-page="home">
<div class="demo"><span><b>●</b> Environnement de démonstration NEAM — aperçus non publiés</span><span>Mode présentation prospect</span></div>
<div class="top"><a href="recherche.html?q=libreville">Projets</a><a href="admin/index.html">Back-office</a><img src="assets/brand/mark.svg" width="34" height="34" alt="NEAM Atelier" style="border-radius:9px"></div>
<main class="home">
  <span class="na-logo stack" style="font-size:78px"><img src="assets/brand/neam-wordmark-dark.png" alt="NEAM"><span class="at">Atelier</span></span>
  <div class="sbox"><div class="search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9aa0a6" stroke-width="2" stroke-linecap="round"><path d="M11 4a7 7 0 100 14 7 7 0 000-14zM20 20l-4-4"/></svg><input type="text" autocomplete="off" autofocus aria-label="Rechercher une entreprise"></div><div class="sugg"></div></div>
  <div style="display:flex;gap:12px"><button class="btn" id="go">Rechercher dans l'Atelier</button><button class="btn" id="lucky">Projet au hasard</button></div>
  <div class="chips" id="chips"></div>
</main>
<div class="foot"><span>Libreville, Gabon</span><span>Aperçus créés par NEAM — environnement privé de démonstration</span></div>
<script src="data/prospects.js"></script><script src="assets/store.js"></script><script src="assets/engine.js"></script>
<script>
const box = document.querySelector('.sbox'), input = box.querySelector('input');
const go = (q) => { if (q.trim()) location.href = 'recherche.html?q=' + encodeURIComponent(q.trim()); };
NEAM.bindSearch(box, go);
document.getElementById('go').onclick = () => go(input.value);
document.getElementById('lucky').onclick = () => { const p = NEAM.P[Math.floor(Math.random() * NEAM.P.length)]; go(p.n); };
const featured = NEAM.P.filter((p) => p.sig).concat(NEAM.P.filter((p) => !p.sig).sort(() => Math.random() - .5).slice(0, 4));
document.getElementById('chips').innerHTML = featured.map((p) => `<a class="chip" href="recherche.html?q=${encodeURIComponent(p.n)}"><span class="mini" style="width:20px;height:20px">${p.avatar}</span>${p.n}</a>`).join('');
</script>
</body></html>
