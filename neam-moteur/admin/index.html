<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<base href="../"><title>Back-office — NEAM Atelier</title><link rel="icon" href="assets/brand/mark.svg"><link rel="stylesheet" href="assets/brand/atelier.css">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/admin.css"></head>
<body>
<aside class="side"><a href="index.html" class="na-logo dark" style="font-size:22px;margin:0 0 22px 12px"><img src="assets/brand/neam-wordmark-light.png" alt="NEAM"><span class="at">Atelier</span></a>
  <a class="it on" href="admin/index.html">Projets</a><a class="it" href="index.html">Moteur de recherche ↗</a>
  <h4>Créer</h4><a class="it" href="admin/fiche.html">Fiche d'établissement</a><a class="it" href="admin/reseau.html">Réseaux sociaux</a>
  <h4>Données</h4><a class="it" href="#" id="reset">Réinitialiser mes saisies</a></aside>
<main class="content">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap"><div><h1>Projets</h1><div class="sub" id="sub"></div></div><a class="cta" href="admin/fiche.html?new=1">+ Nouveau projet</a></div>
  <div class="filters"><input id="f" placeholder="Filtrer par nom, secteur, ville…" style="flex:1;min-width:220px"><select id="k"><option value="">Tous les secteurs</option></select><select id="o"><option value="sc">Plus grosse opportunité d'abord</option><option value="n">Ordre alphabétique</option></select></div>
  <div class="table" id="t"></div>
</main>
<div class="toast" id="toast"></div>
<script src="data/prospects.js"></script><script src="assets/store.js"></script>
<script>
const S = NEAMSTORE, P = PROSPECTS, esc = S.esc;
const sym = (v) => v === 2 ? '<span class="ok">✓</span>' : v === 1 ? '<span class="wip">…</span>' : '<span class="no">—</span>';
const col = (sc) => sc < 15 ? '#fde2e1;color:#b42318' : sc < 30 ? '#fef0c7;color:#b54708' : sc < 45 ? '#fff9c2;color:#8a6d00' : '#dcfae6;color:#067647';
document.getElementById('k').innerHTML += Object.entries(S.SECTORS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('');
function draw() {
  const f = S.slugify(document.getElementById('f').value).replace(/-/g, ' '), k = document.getElementById('k').value, o = document.getElementById('o').value;
  let list = P.filter((p) => (!k || p.k === k) && (!f || S.slugify(p.n + ' ' + p.s + ' ' + p.c).replace(/-/g, ' ').includes(f)));
  list.sort((a, b) => o === 'n' ? a.n.localeCompare(b.n) : a.sc - b.sc);
  const net = (p, n) => (p.nets && p.nets[n]) ? 2 : (p.so || []).includes(n) ? 1 : 0;
  document.getElementById('t').innerHTML = `<div class="tr h"><span></span><span>Entreprise</span><span>Angle</span><span>Score</span><span>Fiche</span><span>Site</span><span>Insta</span><span>TikTok</span><span>FB</span><span>LinkedIn</span><span>Actions</span></div>` +
    list.map((p) => `<div class="tr"><span class="mini">${p.avatar}</span><div><b>${esc(p.n)}</b><div style="color:#5f6368;font-size:12px">${esc(p.s)} · ${esc(p.c)}${p.d ? ' · ' + esc(p.d) : ''}</div></div><span style="font-size:12px;color:#5f6368">${esc(p.a)}</span><span class="score" style="background:${col(p.sc)}">${p.sc}</span>${sym(p.fiche ? 2 : 1)}${sym(p.custom ? 1 : 2)}${sym(net(p, 'instagram'))}${sym(net(p, 'tiktok'))}${sym(net(p, 'facebook'))}${sym(net(p, 'linkedin'))}<span class="acts"><a href="admin/fiche.html?slug=${p.slug}">Fiche</a><a href="admin/reseau.html?slug=${p.slug}">Réseaux</a><a href="recherche.html?q=${encodeURIComponent(p.n)}">Voir</a></span></div>`).join('');
  document.getElementById('sub').textContent = `${list.length} projets · chaque projet est trouvable dans NEAM Atelier · ✓ créé dans le back-office · … existant, à reprendre · — à créer`;
}
['f', 'k', 'o'].forEach((id) => document.getElementById(id).addEventListener('input', draw)); draw();
document.getElementById('reset').onclick = (e) => { e.preventDefault(); if (confirm('Effacer toutes les fiches et réseaux saisis dans ce navigateur ?')) { localStorage.removeItem('neam-projets'); location.reload(); } };
</script>
</body></html>
