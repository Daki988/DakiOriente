<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<base href="../"><title>Réseaux sociaux — Back-office Neam</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/admin.css"><style id="phcss"></style><style>.prev .phone{height:700px;transform-origin:top left}</style></head>
<body>
<aside class="side"><div class="logo"><span>N</span><span>e</span><span>a</span><span>m</span></div>
  <a class="it" href="admin/index.html">Projets</a><a class="it" href="index.html">Moteur de recherche ↗</a>
  <h4>Créer</h4><a class="it" href="admin/fiche.html" id="lnkf">Fiche d'établissement</a><a class="it on" href="admin/reseau.html">Réseaux sociaux</a></aside>
<main class="content"><h1 id="h">Réseaux sociaux</h1><div class="sub">Parcours identique à chaque plateforme. Les codes de confirmation par e-mail ou SMS sont ignorés.</div>
  <div class="filters" id="pick" style="display:none"><select id="ps" style="flex:1"></select></div>
  <div class="netpick" id="np"></div><div id="w"></div></main>
<div class="toast" id="toast"></div>
<script src="data/prospects.js"></script><script src="assets/store.js"></script><script src="assets/wizard.js"></script>
<script>
const S = NEAMSTORE, esc = S.esc, q = new URLSearchParams(location.search);
document.getElementById('phcss').textContent = S.PHONE_CSS;
const slug = q.get('slug'), net = q.get('net') || 'instagram';
const p = PROSPECTS.find((x) => x.slug === slug);
if (!p) { const sel = document.getElementById('ps'); document.getElementById('pick').style.display = ''; sel.innerHTML = '<option value="">Choisir un projet…</option>' + PROSPECTS.map((x) => `<option value="${x.slug}">${esc(x.n)}</option>`).join(''); sel.onchange = () => location.href = 'admin/reseau.html?slug=' + sel.value; }
else {
  document.getElementById('h').textContent = 'Réseaux sociaux — ' + p.n;
  document.getElementById('lnkf').href = 'admin/fiche.html?slug=' + p.slug;
  const NAMES = { instagram: 'Instagram', tiktok: 'TikTok', facebook: 'Page Facebook', linkedin: 'Page LinkedIn' };
  document.getElementById('np').innerHTML = Object.entries(NAMES).map(([k, v]) => `<a href="admin/reseau.html?slug=${p.slug}&net=${k}" class="${k === net ? 'on' : ''}">${v}${(p.nets || {})[k] ? ' ✓' : (p.so || []).includes(k) ? ' · existant' : ''}</a>`).join('');
  const prev = S.get(p.slug).nets || {};
  const d = Object.assign({ user: p.handle, name: p.n, cat: p.s, bio: p.tagline, link: p.domain, btn: 'Contacter', type: 'pro', about: p.intro, tag: p.tagline, sector: p.s, size: '11-50 employés', post: p.tagline }, prev[net] || {});
  const CATS = [p.s, 'Restaurant', 'Hôtel', 'Santé/beauté', 'Immobilier', 'Agence de voyage', 'Commerce local', 'Marque', 'Éducation', 'Services'];
  const done = (extra) => ({ label: 'Terminé', done: 1, t: NAMES[net] + ' prêt', h: 'Le profil apparaît dans les résultats du moteur Neam, comme sur la plateforme.', links: [['Voir le profil', () => `apercu.html?slug=${p.slug}&v=reseaux`], ['Voir dans Neam', () => 'recherche.html?q=' + encodeURIComponent(p.n)], ['Réseau suivant', () => `admin/reseau.html?slug=${p.slug}&net=${{ instagram: 'tiktok', tiktok: 'facebook', facebook: 'linkedin', linkedin: 'instagram' }[net]}`]] });
  const FLOWS = {
    instagram: [
      { label: 'Inscription', t: 'Inscrivez-vous avec votre numéro mobile ou votre e-mail', fields: [{ k: 'contact', l: 'Numéro mobile ou e-mail', ph: p.e || p.t }] },
      { label: 'Code de confirmation', verif: 1, t: 'Saisissez le code de confirmation', h: 'En temps normal : code à 6 chiffres envoyé par SMS ou e-mail.', opts: ['SMS', 'E-mail'] },
      { label: 'Nom d\'utilisateur', t: 'Créez un nom d\'utilisateur', h: 'Vous pourrez le modifier plus tard.', fields: [{ k: 'user', l: 'Nom d\'utilisateur', req: 1 }, { k: 'name', l: 'Nom complet' }] },
      { label: 'Photo de profil', optional: 1, upload: { k: 'avatar', l: 'Ajouter une photo (logo)' }, t: 'Ajoutez une photo de profil', h: 'Ajoutez votre logo pour qu\'on vous reconnaisse.' },
      { label: 'Compte professionnel', t: 'Passez à un compte professionnel', h: 'Accédez aux statistiques et aux boutons de contact.', choice: { k: 'type', o: [['pro', 'Entreprise', 'Commerces, marques, prestataires'], ['crea', 'Créateur', 'Personnalités publiques, artistes']] }, fields: [{ k: 'cat', l: 'Catégorie', list: CATS }] },
      { label: 'Bio et lien', t: 'Modifier le profil', fields: [{ k: 'bio', l: 'Bio', type: 'textarea', max: 150 }, { k: 'link', l: 'Lien', ph: 'www.' }] },
      { label: 'Boutons d\'action', t: 'Ajoutez un bouton d\'action', choice: { k: 'btn', o: [['Contacter', 'Contacter'], ['Réserver', 'Réserver'], ['Commander', 'Commander à emporter'], ['WhatsApp', 'Envoyer un message WhatsApp']] } },
      { label: 'Publications', optional: 1, upload: { k: 'posts', l: 'Importer des photos à publier', multi: 1 }, t: 'Partagez vos premières publications', h: 'Elles s\'affichent en haut de la grille.' },
      done(),
    ],
    tiktok: [
      { label: 'Date de naissance', verif: 1, t: 'Quelle est votre date de naissance ?', h: 'Étape d\'âge minimal, ignorée pour un compte d\'entreprise de démonstration.', opts: ['Jour', 'Mois', 'Année'] },
      { label: 'Inscription', t: 'Inscription par téléphone ou e-mail', fields: [{ k: 'contact', l: 'Téléphone ou e-mail', ph: p.e || p.t }] },
      { label: 'Code', verif: 1, t: 'Saisissez le code à 6 chiffres', h: 'En temps normal : code envoyé par SMS ou e-mail.', opts: ['SMS', 'E-mail'] },
      { label: 'Nom d\'utilisateur', t: 'Créer un nom d\'utilisateur', fields: [{ k: 'user', l: 'Nom d\'utilisateur', req: 1 }] },
      { label: 'Photo de profil', optional: 1, upload: { k: 'avatar', l: 'Importer la photo' }, t: 'Ajoutez une photo de profil' },
      { label: 'Compte Business', t: 'Passez à un compte Business', fields: [{ k: 'cat', l: 'Catégorie', list: CATS }, { k: 'bio', l: 'Bio', type: 'textarea', max: 80 }, { k: 'link', l: 'Site Web' }] },
      { label: 'Vidéos', optional: 1, upload: { k: 'posts', l: 'Importer les miniatures des vidéos', multi: 1 }, t: 'Publiez vos premières vidéos', h: 'Importez une image de couverture pour chaque vidéo.' },
      done(),
    ],
    facebook: [
      { label: 'Nom et catégorie', t: 'Créer une Page', h: 'Utilisez le nom de votre entreprise.', fields: [{ k: 'name', l: 'Nom de la Page', req: 1 }, { k: 'cat', l: 'Catégorie', list: CATS }, { k: 'bio', l: 'Bio (facultatif)', type: 'textarea', max: 255 }] },
      { label: 'Coordonnées', t: 'Ajoutez des coordonnées et un lieu', fields: [{ k: 'phone', l: 'Téléphone', ph: p.t }, { k: 'mail', l: 'E-mail', ph: p.e }, { k: 'web', l: 'Site Web', ph: p.domain }] },
      { label: 'Photos', optional: 1, upload: { k: 'avatar', l: 'Ajouter une photo de profil' }, t: 'Personnalisez votre Page', h: 'Photo de profil (logo).' },
      { label: 'Couverture', optional: 1, upload: { k: 'cover', l: 'Ajouter une photo de couverture' }, t: 'Ajoutez une photo de couverture' },
      { label: 'Bouton d\'action', t: 'Ajoutez un bouton d\'action', choice: { k: 'btn', o: [['Envoyer un message', 'Envoyer un message'], ['Réserver', 'Réserver'], ['Commander', 'Commander'], ['Appeler', 'Appeler']] } },
      { label: 'Inviter des amis', verif: 1, t: 'Invitez vos amis à aimer votre Page', h: 'Étape ignorée en démonstration.', opts: ['Invitations'] },
      { label: 'Première publication', t: 'Rédigez votre première publication', fields: [{ k: 'post', l: 'Texte de la publication', type: 'textarea', max: 500 }], upload: { k: 'posts', l: 'Ajouter une photo', multi: 1 } },
      done(),
    ],
    linkedin: [
      { label: 'Type de page', t: 'Créer une page LinkedIn', choice: { k: 'kind', o: [['ent', 'Entreprise', 'Petite, moyenne ou grande entreprise'], ['vit', 'Page vitrine', 'Sous-page d\'une entreprise'], ['eco', 'Établissement d\'enseignement']] } },
      { label: 'Identité', t: 'Détails de la page', fields: [{ k: 'name', l: 'Nom', req: 1 }, { k: 'url', l: 'linkedin.com/company/', ph: p.handle }, { k: 'web', l: 'Site Web', ph: 'https://' + p.domain }] },
      { label: 'Entreprise', t: 'Détails de l\'entreprise', fields: [{ k: 'sector', l: 'Secteur', list: CATS }, { k: 'size', l: 'Taille de l\'entreprise', type: 'select', o: ['0-1 employé', '2-10 employés', '11-50 employés', '51-200 employés'] }, { k: 'orgtype', l: 'Type d\'entreprise', type: 'select', o: ['Société privée', 'Travailleur indépendant', 'Société civile', 'Administration publique'] }] },
      { label: 'Logo et slogan', t: 'Informations de profil', upload: { k: 'avatar', l: 'Importer le logo' }, fields: [{ k: 'tag', l: 'Slogan', max: 120 }] },
      { label: 'Certification', verif: 1, t: 'Je certifie être un représentant autorisé', h: 'Case de certification et vérification du compte ignorées en démonstration.', opts: ['Certification'] },
      { label: 'À propos', t: 'Présentez votre entreprise', fields: [{ k: 'about', l: 'Description', type: 'textarea', max: 2000 }], upload: { k: 'cover', l: 'Image de couverture' } },
      done(),
    ],
  };
  const steps = FLOWS[net];
  const preview = (d) => { const tmp = Object.assign({}, p, { nets: Object.assign({}, p.nets || {}, { [net]: d }) }); if (d.avatar) tmp.avatar = `<div style="width:100%;height:100%;background:#fff url('${d.avatar}') center/cover"></div>`; return S.phones(tmp, net); };
  const save = (d) => { const nets = Object.assign({}, S.get(p.slug).nets || {}, { [net]: d }); const patch = { nets }; if (d.avatar && !S.get(p.slug).logo) patch.logo = d.avatar; if (d.posts && d.posts.length && net === 'instagram') patch.photosUp = d.posts.slice(0, 3); S.put(p.slug, patch); };
  Wizard({ steps, data: d, preview, onSave: save, onFinish: save, mount: '#w' });
}
</script>
</body></html>
