[build]
  base = "web"
  # Migrations et données de démarrage sur la base PostgreSQL (DATABASE_URL, ex. Neon), puis build Next.js (rendu serveur + API).
  command = "npm ci && npm run db:migrate && npm run db:seed && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Runtime Next.js (rendu serveur, API, middleware) : déclaré explicitement pour les déploiements par envoi direct.
[[plugins]]
  package = "@netlify/plugin-nextjs"
