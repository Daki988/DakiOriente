[build]
  base = "web"
  # Migrations et données de démarrage sur Netlify DB (NETLIFY_DB_URL), puis build Next.js (rendu serveur + API).
  command = "npm ci && npm run db:migrate && npm run db:seed && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
